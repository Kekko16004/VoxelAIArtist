        csgBuild(node.front, front);
    }
    if (back.length) {
        if (!node.back) node.back = csgNode();
        csgBuild(node.back, back);
    }
}

function csgAllPolys(node, list) {
    list = list || [];
    if (!node) return list;
    for (let i = 0; i < node.polygons.length; i++) list.push(node.polygons[i]);
    if (node.front) csgAllPolys(node.front, list);
    if (node.back) csgAllPolys(node.back, list);
    return list;
}

function csgCloneNode(node) {
    if (!node) return null;
    const n = csgNode(node.polygons.map(csgClonePoly));
    if (node.plane) n.plane = { normal: csgCloneV(node.plane.normal), w: node.plane.w };
    n.front = csgCloneNode(node.front);
    n.back = csgCloneNode(node.back);
    return n;
}

function csgInvert(node) {
    if (!node) return null;
    for (let i = 0; i < node.polygons.length; i++) csgFlip(node.polygons[i]);
    if (node.plane) {
        node.plane.normal = csgMul(node.plane.normal, -1);
        node.plane.w = -node.plane.w;
    }
    const t = node.front;
    node.front = csgInvert(node.back);
    node.back = csgInvert(t);
    return node;
}

function csgClipPolys(node, polys) {
    if (!node.plane) return polys.slice();
    const front = [], back = [];
    for (let i = 0; i < polys.length; i++) {
        csgSplitPoly(node.plane, polys[i], front, back, front, back);
    }
    if (node.front) {
        const f = csgClipPolys(node.front, front);
        front.length = 0;
        for (let i = 0; i < f.length; i++) front.push(f[i]);
    }
    if (node.back) {
        const b = csgClipPolys(node.back, back);
        return front.concat(b);
    }
    return front;
}

function csgClipTo(a, b) {
    a.polygons = csgClipPolys(b, a.polygons);
    if (a.front) csgClipTo(a.front, b);
    if (a.back) csgClipTo(a.back, b);
}

function csgMeshToPolys(m) {
    const p = m.pos, idx = m.idx;
    const polys = [];
    for (let i = 0; i < idx.length; i += 3) {
        const ia = idx[i] * 3, ib = idx[i + 1] * 3, ic = idx[i + 2] * 3;
        const verts = [
            csgV(p[ia], p[ia + 1], p[ia + 2]),
            csgV(p[ib], p[ib + 1], p[ib + 2]),
            csgV(p[ic], p[ic + 1], p[ic + 2]),
        ];
        // Scarta triangoli degeneri.
        const e1 = csgSub(verts[1], verts[0]);
        const e2 = csgSub(verts[2], verts[0]);
        const cr = csgCross(e1, e2);
        if (cr.x * cr.x + cr.y * cr.y + cr.z * cr.z < 1e-14) continue;
        polys.push(csgPoly(verts));
    }
    return polys;
}

function csgPolysToMesh(polys, mat, name) {
    const pos = [];
    const idx = [];
    for (let i = 0; i < polys.length; i++) {
        const v = polys[i].vertices;
        // Fan triangulation per poligoni a N lati prodotti dallo split.
        const base = (pos.length / 3) | 0;
        for (let j = 0; j < v.length; j++) {
            pos.push(v[j].x, v[j].y, v[j].z);
        }
        for (let j = 1; j < v.length - 1; j++) {
            idx.push(base, base + j, base + j + 1);
        }
    }
    return meshCreate(pos, idx, mat, name);
}

function csgFromMesh(m) {
    const node = csgNode();
    csgBuild(node, csgMeshToPolys(m));
    return node;
}

function csgUnion(a, b) {
    a = csgCloneNode(a); b = csgCloneNode(b);
    csgClipTo(a, b);
    csgClipTo(b, a);
    csgInvert(b);
    csgClipTo(b, a);
    csgInvert(b);
    csgBuild(a, csgAllPolys(b));
    return a;
}

function csgSubtract(a, b) {
    a = csgCloneNode(a); b = csgCloneNode(b);
    csgInvert(a);
    csgClipTo(a, b);
    csgClipTo(b, a);
    csgInvert(b);
    csgClipTo(b, a);
    csgInvert(b);
    csgBuild(a, csgAllPolys(b));
    csgInvert(a);
    return a;
}

function csgIntersect(a, b) {
    a = csgCloneNode(a); b = csgCloneNode(b);
    csgInvert(a);
    csgClipTo(b, a);
    csgInvert(b);
    csgClipTo(a, b);
    csgClipTo(b, a);
    csgBuild(a, csgAllPolys(b));
    csgInvert(a);
    return a;
}

/**
 * Applica una booleana fra due mesh. Ritorna {mesh, ok, reason}.
 * Se il risultato non e' chiuso o e' vuoto, `ok=false` e mesh = A originale.
 */
function csgApply(meshA, meshB, op) {
    if (meshIsEmpty(meshA)) return { mesh: meshA, ok: false, reason: 'emptyA' };
    if (meshIsEmpty(meshB)) return { mesh: meshA, ok: false, reason: 'emptyB' };
    try {
        const na = csgFromMesh(meshA);
        const nb = csgFromMesh(meshB);
        let result;
        if (op === 'sub') result = csgSubtract(na, nb);
        else if (op === 'int') result = csgIntersect(na, nb);
        else result = csgUnion(na, nb);
        const polys = csgAllPolys(result);
        if (!polys.length) return { mesh: meshA, ok: false, reason: 'emptyResult' };
        const out = csgPolysToMesh(polys, meshA.mat, meshA.name);
        // Un risultato non chiuso e' quasi sempre un fallimento del BSP su
        // geometria non-manifold o coplanare. Si tiene l'originale.
        if (!meshIsClosed(out) && op === 'sub') {
            // Per la sottrazione un buco e' a volte voluto (un tubo): si
            // accetta se l'area e' ragionevole.
            if (meshArea(out) < meshArea(meshA) * 0.01) {
                return { mesh: meshA, ok: false, reason: 'degenerate' };
            }
        }
        return { mesh: out, ok: true, reason: 'ok' };
    } catch (e) {
        return { mesh: meshA, ok: false, reason: 'exception' };
    }
}

// =======================================================================
//  05 - Interprete della spec: nodi -> mesh
//
//  Risolve le espressioni, costruisce le primitive, applica array/mirror/
//  rotazione/traslazione, esegue le booleane nell'ordine di dichiarazione.
//  Ritorna {parts, merged, warnings, bounds} dove `parts` e' una mesh per
//  nodo visibile (per l'export a parti nominate e per il rig).
// =======================================================================

function resolveNode(node, params) {
    // Copia con tutti i campi numerici risolti.
    const n = { n: node.n, p: node.p || 'box' };
    if (node.s != null) n.s = evalVec3(node.s, params, [1, 1, 1]);
    else n.s = [1, 1, 1];
    n.at = node.at != null ? evalVec3(node.at, params, [0, 0, 0]) : [0, 0, 0];
    if (node.rot != null) n.rot = evalVec3(node.rot, params, [0, 0, 0]);
    for (const k of ['r', 'r2', 'len', 'taper', 'arc', 'wall', 'bevel',
                     'amp', 'freq', 'turns', 'inner', 'twist', 'bendA']) {
        if (node[k] != null) n[k] = evalExpr(node[k], params);
    }
    for (const k of ['sides', 'steps', 'seed']) {
        if (node[k] != null) n[k] = Math.round(evalExpr(node[k], params));
    }
    if (node.axis) n.axis = node.axis;
    if (node.shape) n.shape = node.shape;
    if (node.bendTo) n.bendTo = node.bendTo;

    // Deformatori: i loro campi sono oggetti, e ognuno puo' contenere
    // espressioni. Si risolvono qui, non nel deformatore, cosi' quel modulo
    // resta puramente geometrico e testabile con numeri.
    function pair(v) {
        if (v == null) return null;
        if (typeof v === 'object' && !Array.isArray(v)) {
            const a = v.a != null ? v.a : (v.x != null ? v.x : (v.w != null ? v.w : 1));
            const b = v.b != null ? v.b : (v.z != null ? v.z : (v.d != null ? v.d : a));
            return { a: evalExpr(a, params), b: evalExpr(b, params) };
        }
        if (Array.isArray(v)) {
            return { a: evalExpr(v[0], params),
                     b: evalExpr(v.length > 1 ? v[1] : v[0], params) };
        }
        const s = evalExpr(v, params);
        return { a: s, b: s };
    }
    if (node.taperTo != null) n.taperTo = pair(node.taperTo);
    if (node.taper0 != null) n.taper0 = pair(node.taper0);
    if (node.squash) {
        n.squash = {
            axis: node.squash.axis || 'z',
            side: node.squash.side || 'max',
            f: node.squash.f != null ? evalExpr(node.squash.f, params) : 0.5,
        };
    }
    if (node.shear) {
        n.shear = {
            by: node.shear.by || 'z',
            amount: evalExpr(node.shear.amount != null ? node.shear.amount : 0, params),
        };
    }
    if (node.warp) {
        n.warp = {
            amp: evalExpr(node.warp.amp != null ? node.warp.amp : 0, params),
            freq: evalExpr(node.warp.freq != null ? node.warp.freq : 4, params),
            seed: Math.round(evalExpr(node.warp.seed != null ? node.warp.seed : 0, params)),
        };
    }

    if (node.prof != null) {
        if (Array.isArray(node.prof)) {
            n.prof = node.prof.map(p => [
                evalExpr(p[0], params), evalExpr(p[1], params)]);
        } else n.prof = node.prof;
    }
    if (node.secs) {
        n.secs = node.secs.map(s => ({
            at: evalExpr(s.at, params),
            s: evalVec3(s.s, params, [1, 1, 1]),
        }));
    }
    if (node.path) {
        n.path = node.path.map(p => evalVec3(p, params, [0, 0, 0]));
    }
    if (node.op) { n.op = node.op; n.of = node.of; }
    if (node.arr) {
        n.arr = {
            n: Math.max(1, Math.round(evalExpr(node.arr.n, params))),
            step: evalVec3(node.arr.step, params, [0, 0, 0]),
        };
        if (node.arr.rot) n.arr.rot = evalVec3(node.arr.rot, params, [0, 0, 0]);
    }
    if (node.mir) n.mir = node.mir;
    if (node.mat) n.mat = node.mat;
    if (node.bone) n.bone = node.bone;
    if (node.role) n.role = node.role;
    if (node.hidden) n.hidden = true;
    if (node.locked) n.locked = true;
    if (node.interactive) n.interactive = true;
    return n;
}

function transformInstance(mesh, at, rot, i, arr) {
    let m = meshClone(mesh);
    if (arr && i > 0) {
        meshTranslate(m, arr.step[0] * i, arr.step[1] * i, arr.step[2] * i);
        if (arr.rot) {
            meshRotate(m, (arr.rot[0] || 0) * i, (arr.rot[1] || 0) * i, (arr.rot[2] || 0) * i);
        }
    }
    if (rot) meshRotate(m, rot[0] || 0, rot[1] || 0, rot[2] || 0);
    if (at) meshTranslate(m, at[0] || 0, at[1] || 0, at[2] || 0);
    return m;
}

function buildNodeMesh(node, seg, bevelSeg) {
    const base = primBuild(node, seg, bevelSeg);
    // I deformatori agiscono in SPAZIO LOCALE, prima di rotazione e
    // traslazione: rastremare dopo aver ruotato darebbe una sezione che varia
    // lungo una direzione obliqua rispetto al pezzo.
    applyDeformers(base, node);
    base.mat = node.mat || '';
    base.name = node.n || '';
    const count = (node.arr && node.arr.n) || 1;
    const instances = [];
    for (let i = 0; i < count; i++) {
        instances.push(transformInstance(base, node.at, node.rot, i, node.arr));
    }
    let m = instances.length === 1 ? instances[0] : meshMerge(instances);
    if (node.mir) {
        const mirrored = meshClone(m);
        meshMirror(mirrored, node.mir);
        m = meshMerge([m, mirrored]);
    }
    m.mat = node.mat || '';
    m.name = node.n || '';
    return m;
}

function buildSpec(spec) {
    const warnings = [];
    if (!spec || !spec.nodes || !spec.nodes.length) {
        return { parts: [], merged: meshCreate([], []), warnings: [{ code: 'empty' }],
                 bounds: meshBounds(meshCreate([], [])) };
    }
    const params = Object.assign({}, spec.params || {});
    const detail = Math.max(0, Math.min(3, spec.detail | 0));
    const seg = DETAIL_LEVELS[detail].seg;
    const bevelSeg = DETAIL_LEVELS[detail].bevel;

    // Budget nodi: non si taglia in silenzio, si avvisa.
    const budget = DETAIL_LEVELS[detail].nodes;
    if (spec.nodes.length > budget) {
        warnings.push({ code: 'overBudget', v: spec.nodes.length + '>' + budget });
    }

    const resolved = spec.nodes.map(n => resolveNode(n, params));
    const byName = {};
    const solidMeshes = {};   // nome -> mesh (dopo trasformazioni, prima delle booleane)
    const isTool = {};        // nodi usati come utensili booleani

    for (const n of resolved) {
        if (n.op && n.of) isTool[n.n] = true;
    }

    for (const n of resolved) {
        try {
            solidMeshes[n.n] = buildNodeMesh(n, seg, bevelSeg);
        } catch (e) {
            warnings.push({ code: 'buildFail', at: n.n, v: String(e.message || e).slice(0, 60) });
            solidMeshes[n.n] = meshCreate([], [], n.mat, n.n);
        }
        byName[n.n] = n;
    }

    // Booleane in ordine di dichiarazione. Un utensile puo' colpire un target
    // gia' modificato da un'op precedente.
    const live = Object.assign({}, solidMeshes);
    for (const n of resolved) {
        if (!n.op || !n.of) continue;
        const target = live[n.of];
        const tool = live[n.n] || solidMeshes[n.n];
        if (!target || meshIsEmpty(target)) {
            warnings.push({ code: 'boolMissingTarget', at: n.n, v: n.of });
            continue;
        }
        if (!tool || meshIsEmpty(tool)) {
            warnings.push({ code: 'boolMissingTool', at: n.n });
            continue;
        }
        const result = csgApply(target, tool, n.op);
        if (!result.ok) {
            warnings.push({ code: 'boolFailed', at: n.n, v: result.reason });
        } else {
            result.mesh.mat = target.mat;
            result.mesh.name = n.of;
            live[n.of] = result.mesh;
        }
        // L'utensile non e' mai visibile.
        live[n.n] = null;
    }

    const parts = [];
    for (const n of resolved) {
        if (isTool[n.n]) continue;
        if (n.hidden) continue;
        const m = live[n.n];
        if (!m || meshIsEmpty(m)) continue;
        m.name = n.n;
        m.mat = n.mat || m.mat || '';
        m.bone = n.bone || '';
        m.role = n.role || '';
        parts.push(m);
    }

    // Ground: se richiesto, sposta tutto cosi' il minimo Y sia 0.
    let merged = parts.length ? meshMerge(parts) : meshCreate([], []);
    if (spec.ground !== false && !meshIsEmpty(merged)) {
        const b = meshBounds(merged);
        if (Math.abs(b.min[1]) > 1e-5) {
            const dy = -b.min[1];
            for (const p of parts) meshTranslate(p, 0, dy, 0);
            meshTranslate(merged, 0, dy, 0);
        }
    }

    return {
        parts: parts,
        merged: parts.length ? meshMerge(parts) : merged,
        warnings: warnings,
        bounds: meshBounds(parts.length ? meshMerge(parts) : merged),
        resolved: resolved,
    };
}

// =======================================================================
//  06 - Validatori geometrici deterministici (zero chiamate AI)
//
//  Ogni validatore ritorna 0..N difetti {code, sev, where, what, fix}.
//  Si misurano sulla mesh costruita + sulla spec. Auto-riparazione solo
//  dell'inequivocabile (vedi autoRepair).
// =======================================================================

function defect(code, sev, where, what, fix) {
    return { code: code, sev: sev || 'medium', where: where || '',
             what: what || '', fix: fix || '' };
}

/** Occupancy grid SOLIDA: si rasterizzano i triangoli, non i vertici.
 *
 *  Campionare solo vertici e baricentri lascia buchi lungo le facce grandi, e
 *  il conteggio delle componenti connesse diventa una fabbrica di falsi
 *  positivi: su una spada dava "30 frammenti e 5 parti staccate" per un
 *  oggetto tutto attaccato. Qui ogni triangolo viene campionato sulla sua
 *  superficie con passo mezza cella, cosi' una faccia continua riempie celle
 *  contigue.
 */
function voxelizeBounds(mesh, res) {
    res = res || 24;
    const b = meshBounds(mesh);
    const size = b.size;
    const maxS = Math.max(size[0], size[1], size[2], 1e-6);
    const cell = maxS / res;
    const nx = Math.max(1, Math.ceil(size[0] / cell) + 1);
    const ny = Math.max(1, Math.ceil(size[1] / cell) + 1);
    const nz = Math.max(1, Math.ceil(size[2] / cell) + 1);
    const grid = new Uint8Array(nx * ny * nz);
    const p = mesh.pos, idx = mesh.idx;

    function mark(x, y, z) {
        const ix = Math.min(nx - 1, Math.max(0, ((x - b.min[0]) / cell) | 0));
        const iy = Math.min(ny - 1, Math.max(0, ((y - b.min[1]) / cell) | 0));
        const iz = Math.min(nz - 1, Math.max(0, ((z - b.min[2]) / cell) | 0));
        grid[ix + iy * nx + iz * nx * ny] = 1;
    }

    for (let i = 0; i < idx.length; i += 3) {
        const ia = idx[i] * 3, ib = idx[i + 1] * 3, ic = idx[i + 2] * 3;
        const ax = p[ia], ay = p[ia + 1], az = p[ia + 2];
        const bx = p[ib], by = p[ib + 1], bz = p[ib + 2];
        const cx = p[ic], cy = p[ic + 1], cz = p[ic + 2];
        // Passo di campionamento: mezza cella sul lato piu' lungo.
        const e1 = Math.max(Math.abs(bx - ax), Math.abs(by - ay), Math.abs(bz - az));
        const e2 = Math.max(Math.abs(cx - ax), Math.abs(cy - ay), Math.abs(cz - az));
        const n1 = Math.min(64, Math.max(1, Math.ceil(e1 / (cell * 0.5))));
        const n2 = Math.min(64, Math.max(1, Math.ceil(e2 / (cell * 0.5))));
        for (let u = 0; u <= n1; u++) {
            const fu = u / n1;
            for (let v = 0; v <= n2; v++) {
                const fv = v / n2;
                if (fu + fv > 1) continue;   // dentro il triangolo
                mark(ax + (bx - ax) * fu + (cx - ax) * fv,
                     ay + (by - ay) * fu + (cy - ay) * fv,
                     az + (bz - az) * fu + (cz - az) * fv);
            }
        }
    }
    return { grid: grid, nx: nx, ny: ny, nz: nz, cell: cell, bounds: b };
}

/** Componenti connesse a 26 vicini.
 *
 *  A 6 vicini due pezzi che si toccano di spigolo (una guardia infilata su una
 *  lama, una ruota su un assale) risultano staccati: e' geometria che in un
 *  motore di gioco e' saldata, e chiamarla "parte fluttuante" manda a caccia di
 *  un difetto che non c'e'.
 */
function countComponents(vox) {
    const { grid, nx, ny, nz } = vox;
    const seen = new Uint8Array(grid.length);
    const sizes = [];
    const stack = [];
    for (let i = 0; i < grid.length; i++) {
        if (!grid[i] || seen[i]) continue;
        let count = 0;
        stack.push(i);
        seen[i] = 1;
        while (stack.length) {
            const cur = stack.pop();
            count++;
            const x = cur % nx;
            const y = ((cur / nx) | 0) % ny;
            const z = (cur / (nx * ny)) | 0;
            for (let dz = -1; dz <= 1; dz++) {
                const zz = z + dz;
                if (zz < 0 || zz >= nz) continue;
                for (let dy = -1; dy <= 1; dy++) {
                    const yy = y + dy;
                    if (yy < 0 || yy >= ny) continue;
                    for (let dx = -1; dx <= 1; dx++) {
                        const xx = x + dx;
                        if (xx < 0 || xx >= nx) continue;
                        if (!dx && !dy && !dz) continue;
                        const n = xx + yy * nx + zz * nx * ny;
                        if (grid[n] && !seen[n]) { seen[n] = 1; stack.push(n); }
                    }
                }
            }
        }
        sizes.push(count);
    }
    sizes.sort((a, b) => b - a);
    return sizes;
}

function validateGround(spec, built) {
    const d = [];
    const b = built.bounds;
    if (spec.ground !== false) {
        if (b.min[1] > 0.05) {
            d.push(defect('floating', 'high', '',
                'L\'asset galleggia a y=' + b.min[1].toFixed(3) + ' invece di poggiare a terra.',
                'Impostare ground:true e traslare di -minY.'));
        } else if (b.min[1] < -0.05) {
            d.push(defect('sinking', 'high', '',
                'L\'asset affonda sotto y=0 (minY=' + b.min[1].toFixed(3) + ').',
                'Traslare di -minY per appoggiarlo a terra.'));
        }
    }
    return d;
}

function validateSize(spec, built) {
    const d = [];
    const target = spec.size || [1, 1, 1];
    const size = built.bounds.size;
    for (let i = 0; i < 3; i++) {
        const t = Math.max(0.01, target[i] || 1);
        const s = size[i] || 0;
        const ratio = s / t;
        if (ratio < 0.4 || ratio > 2.5) {
            const axis = 'XYZ'[i];
            d.push(defect('sizeMismatch', 'medium', axis,
                'Ingombro ' + axis + '=' + s.toFixed(3) + 'm contro target ' + t.toFixed(3) + 'm (rapporto ' + ratio.toFixed(2) + ').',
                'Riscalare o correggere i params che comandano l\'asse ' + axis + '.'));
        }
    }
    if (size[0] < 0.01 && size[1] < 0.01 && size[2] < 0.01) {
        d.push(defect('emptyMesh', 'high', '',
            'La mesh risultante e\' vuota o degenerata.',
            'Verificare che i nodi producano volumi reali.'));
    }
    return d;
}

function validateSymmetry(spec, built) {
    const d = [];
    const flags = spec.flags || [];
    const wants = flags.indexOf('symmetric_x') >= 0
        || spec.cat === 'char' || spec.cat === 'vehicle';
    if (!wants || meshIsEmpty(built.merged)) return d;
    const vox = voxelizeBounds(built.merged, 20);
    const { grid, nx, ny, nz } = vox;
    let total = 0, mismatch = 0;
    for (let z = 0; z < nz; z++) {
        for (let y = 0; y < ny; y++) {
            for (let x = 0; x < Math.floor(nx / 2); x++) {
                const mx = nx - 1 - x;
                const a = grid[x + y * nx + z * nx * ny];
                const b = grid[mx + y * nx + z * nx * ny];
                if (a || b) total++;
                if (a !== b) mismatch++;
            }
        }
    }
    if (total > 0 && mismatch / total > 0.18) {
        d.push(defect('asymmetric', 'high', 'x',
            'Simmetria sinistra/destra scarsa: ' + Math.round(100 * mismatch / total) + '% delle celle non combacia.',
            'Usare mir:x sulle parti pari (braccia, gambe, ruote) invece di nodi separati.'));
    }
    return d;
}

function validateComponents(spec, built) {
    const d = [];
    if (meshIsEmpty(built.merged)) return d;
    const vox = voxelizeBounds(built.merged, 26);
    const sizes = countComponents(vox);
    if (sizes.length > 1) {
        const main = sizes[0] || 1;
        const scraps = sizes.slice(1).filter(s => s / main < 0.02);
        const big = sizes.slice(1).filter(s => s / main >= 0.02);
        if (big.length) {
            d.push(defect('detachedParts', 'high', '',
                (big.length + 1) + ' componenti connesse distinte: parti staccate o fluttuanti.',
                'Collegare le parti al corpo principale: ogni pezzo deve toccare un vicino.'));
        }
        if (scraps.length > 2) {
            d.push(defect('scraps', 'low', '',
                scraps.length + ' frammenti sotto il 2% del volume principale.',
                'Eliminare i nodi spuri o unirli al corpo.'));
        }
    }
    return d;
}

/** Bbox per ogni parte nominata: e' cio' che l'audit confronta col piano. */
function partMetrics(built) {
    const out = {};
    for (const part of (built.parts || [])) {
        if (!part.name || meshIsEmpty(part)) continue;
        const b = meshBounds(part);
        const r = (v) => Math.round(v * 100000) / 100000;
        out[part.name] = {
            min: b.min.map(r),
            max: b.max.map(r),
            size: b.size.map(r),
        };
    }
    return out;
}

/** Payload di misura per `POST /api/asset/audit`. */
function measuredFor(built, spec) {
    const b = built.bounds;
    const r = (v) => Math.round(v * 100000) / 100000;
    const locked = ((spec && spec.nodes) || [])
        .filter(n => n.locked).map(n => n.n);
    return {
        total: b.size.map(r),
        min: b.min.map(r),
        max: b.max.map(r),
        parts: partMetrics(built),
        locked: locked,
    };
}

function validateFlatTop(spec, built) {
    const d = [];
    if (meshIsEmpty(built.merged)) return d;
    const flags = spec.flags || [];
    const b = built.bounds;
    // Una bandiera non basta: il modello scrive `flat_top` anche su una spada,
    // perche' la regola compare fra quelle generali del prompt. Si pretende che
    // l'oggetto sia DAVVERO una piattaforma — impronta larga e bassa — o che lo
    // dica il nome. Senza questa guardia il validatore chiedeva di appiattire la
    // punta di una lama.
    const wide = b.size[0] > b.size[1] * 1.8 && b.size[2] > b.size[1] * 1.8;
    const named = /platform|piattaforma|pad|raft|pedana|piano|deck|ponte/i.test(spec.id || '');
    const isPlatform = (flags.indexOf('flat_top') >= 0 && wide) || named;
    if (!isPlatform) return d;
    const topY = b.max[1];
    const p = built.merged.pos;
    // Variazione delle Y dei vertici nel 10% superiore.
    let minTop = Infinity, maxTop = -Infinity, n = 0;
    const thresh = topY - Math.max(b.size[1] * 0.08, 0.02);
    for (let i = 1; i < p.length; i += 3) {
        if (p[i] >= thresh) {
            if (p[i] < minTop) minTop = p[i];
            if (p[i] > maxTop) maxTop = p[i];
            n++;
        }
    }
    if (n > 4 && (maxTop - minTop) > Math.max(0.03, b.size[1] * 0.05)) {
        d.push(defect('notFlatTop', 'high', 'top',
            'Faccia superiore non piatta: variazione ' + (maxTop - minTop).toFixed(3) + 'm.',
            'Appiattire la faccia superiore; i dettagli vanno sotto o sul bordo.'));
    }
    // Centro ostruito.
    if (flags.indexOf('no_center_pivot') >= 0 || isPlatform) {
        const cx = b.center[0], cz = b.center[2];
        const rx = b.size[0] * 0.15, rz = b.size[2] * 0.15;
        let above = 0;
        for (let i = 0; i < p.length; i += 3) {
            if (Math.abs(p[i] - cx) < rx && Math.abs(p[i + 2] - cz) < rz
                    && p[i + 1] > topY - 0.01 + 0.02) {
                above++;
            }
        }
        if (above > 6) {
            d.push(defect('centerObstruction', 'high', 'center',
                'Geometria al centro sopra il piano della piattaforma (' + above + ' vertici).',
                'Eliminare sbarre/perni centrali; la superficie deve restare libera.'));
        }
    }
    return d;
}

function validateLimbs(spec, built) {
    const d = [];
    if (spec.cat !== 'char') return d;
    const nodes = (built.resolved || []).filter(n => !n.op);
    const armish = nodes.filter(n => /arm|braccio|mano|hand|upperarm|lowerarm/i.test(n.n + ' ' + (n.role || '')));
    const names = nodes.map(n => n.n).join(' ');
    // Se c'e' mir:x su un braccio, conta come due.
    let armCount = 0;
    for (const n of armish) armCount += n.mir === 'x' ? 2 : 1;
    // Heuristica: se non ci sono nodi "arm", cerca simmetria generale.
    if (armish.length === 0) {
        // Forse l'AI ha usato nomi generici: controlla asimmetria gia' coperta.
        return d;
    }
    if (armCount < 2) {
        d.push(defect('missingLimb', 'high', 'arm',
            'Braccia insufficienti (' + armCount + '): un umanoide ne serve due.',
            'Aggiungere un nodo caps/box per il braccio con mir:x.'));
    }
    // Braccia abbassate: la Y del centro del braccio deve essere sotto la spalla
    // (approssimata come 0.7 * altezza).
    const height = built.bounds.size[1] || 1;
    const shoulderY = built.bounds.min[1] + height * 0.75;
    for (const n of armish) {
        if (n.at && n.at[1] > shoulderY + height * 0.05) {
            d.push(defect('armsNotDown', 'high', n.n,
                'Il braccio "' + n.n + '" e\' troppo in alto (y=' + n.at[1].toFixed(2) + '), non lungo il fianco.',
                'Abbassare la Y del braccio sotto la spalla; a riposo la mano sta piu\' in basso della spalla.'));
            break;
        }
    }
    // Equipaggiamento fuso nella testa.
    const headish = nodes.filter(n => /head|testa|cam|camera|antenna|visor|helmet/i.test(n.n + ' ' + (n.role || '')));
    for (const n of headish) {
        if (/cam|camera|antenna|visor|scope/i.test(n.n) && !/helmet|head|testa/i.test(spec.id || '')) {
            d.push(defect('headGear', 'medium', n.n,
                'Possibile equipaggiamento fuso nella testa: "' + n.n + '".',
                'Rimuovere se non richiesto nel prompt; la testa e\' la testa.'));
        }
    }
    return d;
}

function validateCabin(spec, built) {
    const d = [];
    if (spec.cat !== 'vehicle') return d;
    const nodes = (built.resolved || []).filter(n => !n.op);
    const cabin = nodes.filter(n => /cabin|cabina|cockpit|cabin|glass|vetro|canopy|abitacolo/i.test(n.n + ' ' + (n.role || '')));
    if (!cabin.length) {
        d.push(defect('noCabin', 'medium', '',
            'Nessun nodo riconoscibile come cabina/abitacolo.',
            'Aggiungere un volume cabina maggiorato, cavo se possibile.'));
        return d;
    }
    // Rapporto volume cabina / veicolo.
    let cabinVol = 0;
    for (const n of cabin) {
        const s = n.s || [0, 0, 0];
        cabinVol += Math.abs(s[0] * s[1] * s[2]);
    }
    const body = built.bounds.size;
    const bodyVol = Math.max(1e-6, body[0] * body[1] * body[2]);
    if (cabinVol / bodyVol < 0.05) {
        d.push(defect('smallCabin', 'high', cabin[0].n,
            'Cabina troppo piccola (' + Math.round(100 * cabinVol / bodyVol) + '% del volume).',
            'Maggiore i params della cabina: deve essere abbondante e leggibile.'));
    }
    return d;
}

function validateDegenerates(spec, built) {
    const d = [];
    if (meshIsEmpty(built.merged)) return d;
    const area = meshArea(built.merged);
    if (area < 1e-6) {
        d.push(defect('zeroArea', 'high', '', 'Area totale quasi zero.', 'Ricontrollare le primitive.'));
    }
    const p = built.merged.pos;
    for (let i = 0; i < p.length; i++) {
        if (!isFinite(p[i])) {
            d.push(defect('nanVerts', 'high', '', 'Vertici con NaN/Inf.', 'Espressione o primitiva degenerata.'));
            break;
        }
    }
    const tris = meshTriCount(built.merged);
    if (tris > 200000) {
        d.push(defect('tooManyTris', 'medium', '',
            tris + ' triangoli: troppo per un asset di gioco a questo detail.',
            'Ridurre detail o semplificare le primitive tonde.'));
    }
    return d;
}

function validateLogic(spec) {
    const d = [];
    const nodes = spec.nodes || [];
    const logic = spec.logic || [];
    const bound = new Set(logic.map(l => l.on));
    for (const n of nodes) {
        if (n.interactive && !bound.has(n.n)) {
            d.push(defect('unboundInteractive', 'medium', n.n,
                'Nodo interattivo "' + n.n + '" senza voce in logic.',
                'Aggiungere {"on":"' + n.n + '","var":"...","trig":"interact"}.'));
        }
    }
    return d;
}

function validateAll(spec, built, opts) {
    opts = opts || {};
    let defects = []
        .concat(validateGround(spec, built))
        .concat(validateSymmetry(spec, built))
        .concat(validateComponents(spec, built))
        .concat(validateFlatTop(spec, built))
        .concat(validateLimbs(spec, built))
        .concat(validateCabin(spec, built))
        .concat(validateDegenerates(spec, built))
        .concat(validateLogic(spec));
    // Con un PIANO l'ingombro non si giudica qui: l'audit lo confronta pezzo per
    // pezzo con numeri verificati, e un secondo giudizio piu' grezzo sullo stesso
    // fatto produrrebbe due difetti per una causa sola.
    if (!opts.hasPlan) defects = defects.concat(validateSize(spec, built));
    const rank = { high: 0, medium: 1, low: 2 };
    defects.sort((a, b) => (rank[a.sev] || 9) - (rank[b.sev] || 9));
    return defects;
}

function metricsOf(spec, built) {
    const b = built.bounds;
    const vox = meshIsEmpty(built.merged) ? null : voxelizeBounds(built.merged, 18);
    const comps = vox ? countComponents(vox) : [];
    return {
        nodes: (spec.nodes || []).length,
        parts: (built.parts || []).length,
        tris: meshTriCount(built.merged),
        verts: meshVertCount(built.merged),
        area: Math.round(meshArea(built.merged) * 1000) / 1000,
        volume: Math.round(Math.abs(meshVolume(built.merged)) * 1000) / 1000,
        closed: meshIsClosed(built.merged),
        boundaryEdges: meshBoundaryEdges(built.merged),
        bounds: {
            min: b.min.map(x => Math.round(x * 1000) / 1000),
            max: b.max.map(x => Math.round(x * 1000) / 1000),
            size: b.size.map(x => Math.round(x * 1000) / 1000),
        },
        targetSize: spec.size || null,
        components: comps.length,
        componentSizes: comps.slice(0, 6),
        ground: !!spec.ground,
        cat: spec.cat,
        style: spec.style,
        flags: spec.flags || [],
        warnings: (built.warnings || []).length,
    };
}

/** Auto-riparazione solo dell'inequivocabile. Ritorna {spec, repairs}. */
function autoRepair(spec, built) {
    const repairs = [];
    const out = JSON.parse(JSON.stringify(spec));

    // Appoggio a terra.
    if (out.ground !== false && built.bounds && Math.abs(built.bounds.min[1]) > 0.02) {
        const dy = -built.bounds.min[1];
        for (const n of out.nodes || []) {
            if (Array.isArray(n.at) && typeof n.at[1] === 'number') n.at[1] += dy;
        }
        repairs.push('groundShift:' + dy.toFixed(3));
    }

    // Riscalatura all'ingombro dichiarato (se TUTTI e 3 gli assi sono fuori di un
    // fattore simile: altrimenti e' una forma sbagliata, non una scala).
    if (out.size && built.bounds) {
        const t = out.size, s = built.bounds.size;
        const ratios = [0, 1, 2].map(i => (s[i] > 1e-6 ? t[i] / s[i] : 1));
        const mean = (ratios[0] + ratios[1] + ratios[2]) / 3;
        const spread = Math.max(...ratios.map(r => Math.abs(r - mean)));
        if (mean > 0 && (mean < 0.5 || mean > 2.0) && spread < mean * 0.35) {
            for (const k of Object.keys(out.params || {})) {
                if (typeof out.params[k] === 'number') out.params[k] *= mean;
            }
            repairs.push('uniformScale:' + mean.toFixed(3));
        }
    }

    return { spec: out, repairs: repairs };
}

// =======================================================================
//  07 - Materiali procedurale (rumore in object space, niente UV)
// =======================================================================

const _matCache = new Map();

function hexToRgb(hex) {
    const h = String(hex || '#CCCCCC').replace('#', '');
    const n = parseInt(h.length === 3
        ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h, 16);
    return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 };
}

// Chunk GLSL di value-noise / fbm / cell, in object space.
const NOISE_GLSL = `
float _samHash(vec3 p){
  p = fract(p*0.3183099+0.1);
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float _samNoise(vec3 x){
  vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(_samHash(i+vec3(0,0,0)),_samHash(i+vec3(1,0,0)),f.x),
                 mix(_samHash(i+vec3(0,1,0)),_samHash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(_samHash(i+vec3(0,0,1)),_samHash(i+vec3(1,0,1)),f.x),
                 mix(_samHash(i+vec3(0,1,1)),_samHash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float _samFbm(vec3 p){
  float a=0.5; float v=0.0;
  for(int i=0;i<4;i++){ v+=a*_samNoise(p); p*=2.02; a*=0.5; }
  return v;
}
float _samCell(vec3 p){
  vec3 i=floor(p); vec3 f=fract(p);
  float md=1.0;
  for(int z=-1;z<=1;z++) for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=vec3(_samHash(i+g),_samHash(i+g+1.3),_samHash(i+g+2.7));
    vec3 r=g+o-f; md=min(md,dot(r,r));
  }
  return sqrt(md);
}
`;

function makeGradientEnv() {
    // CubeTexture a gradiente su canvas: metalness senza envMap rende NERO
    // (e' fisicamente giusto: niente da riflettere). Il cielo e' chiaro in alto
    // e il terreno scuro in basso, cosi' un metallo mostra un orizzonte invece
    // di una tinta piatta — e' l'orizzonte a farlo leggere come metallo.
    const size = 64;
    const faces = [];
    const spec = [
        { top: [150, 168, 190], bot: [70, 74, 86] },    // +x
        { top: [130, 148, 172], bot: [62, 66, 78] },    // -x
        { top: [205, 222, 240], bot: [190, 205, 225] }, // +y (cielo)
        { top: [40, 40, 48], bot: [26, 26, 32] },       // -y (terra)
        { top: [140, 158, 182], bot: [66, 70, 82] },    // +z
        { top: [120, 138, 162], bot: [58, 62, 74] },    // -z
    ];
    for (let f = 0; f < 6; f++) {
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, size);
        const s = spec[f];
        g.addColorStop(0, 'rgb(' + s.top.join(',') + ')');
        g.addColorStop(1, 'rgb(' + s.bot.join(',') + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        // Una macchia chiara: e' il riflesso speculare che da' la "luce"
        // ai metalli e alle vernici lucide.
        if (f === 2 || f === 4) {
            const rg = ctx.createRadialGradient(size * 0.35, size * 0.3, 1,
                                                size * 0.35, size * 0.3, size * 0.5);
            rg.addColorStop(0, 'rgba(255,255,255,0.9)');
            rg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = rg;
            ctx.fillRect(0, 0, size, size);
        }
        faces.push(c);
    }
    const tex = new THREE.CubeTexture(faces);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    return tex;
}

let _envMap = null;
function getEnvMap() {
    if (!_envMap) _envMap = makeGradientEnv();
    return _envMap;
}

function buildMaterial(def, style) {
    def = def || { col: '#CCCCCC' };
    style = style || 'lowpoly';
    const key = JSON.stringify(def) + '|' + style;
    if (_matCache.has(key)) return _matCache.get(key);

    const rgb = hexToRgb(def.col || '#CCCCCC');
    const rough = def.rough != null ? def.rough : 0.7;
    const metal = def.metal != null ? def.metal : 0;
    const emit = def.emit || 0;
    const opacity = def.opacity != null ? def.opacity : 1;
    const noise = def.noise || null;

    let mat;
    if (style === 'toon') {
        mat = new THREE.MeshToonMaterial({
            color: new THREE.Color(rgb.r, rgb.g, rgb.b),
            transparent: opacity < 1,
            opacity: opacity,
        });
    } else if (style === 'pbr') {
        // MeshPhysicalMaterial: il clearcoat e' cio' che fa leggere una vernice
        // come vernice e un metallo lucidato come lucidato. Su MeshStandard non
        // c'e', e il risultato e' "plastica opaca" qualunque valore si metta.
        mat = new THREE.MeshPhysicalMaterial({
            color: new THREE.Color(rgb.r, rgb.g, rgb.b),
            roughness: rough,
            metalness: metal,
            transparent: opacity < 1,
            opacity: opacity,
            envMap: getEnvMap(),
            envMapIntensity: 1.15,
            clearcoat: metal > 0.5 ? 0.35 : (rough < 0.4 ? 0.5 : 0.08),
            clearcoatRoughness: Math.max(0.04, rough * 0.5),
            sheen: rough > 0.75 ? 0.25 : 0,   // tessuti, cuoio, legno grezzo
            sheenColor: new THREE.Color(rgb.r, rgb.g, rgb.b),
            flatShading: false,
        });
    } else {
        mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(rgb.r, rgb.g, rgb.b),
            roughness: rough,
            metalness: metal,
            flatShading: true,
            transparent: opacity < 1,
            opacity: opacity,
            envMap: getEnvMap(),
            envMapIntensity: metal > 0.1 ? 0.85 : 0.4,
        });
    }
    if (emit > 0 && mat.emissive) {
        const ec = def.emitCol ? hexToRgb(def.emitCol) : rgb;
        mat.emissive = new THREE.Color(ec.r, ec.g, ec.b);
        mat.emissiveIntensity = emit;
    }

    // Rumore procedurale via onBeforeCompile (object-space, triplanare).
    if (noise && noise.t && noise.t !== 'none' && style !== 'toon') {
        const scale = noise.scale || 12;
        const amp = noise.amp != null ? noise.amp : 0.18;
        const seed = noise.seed || 0;
        const col2 = noise.col2 ? hexToRgb(noise.col2) : {
            r: rgb.r * 0.6, g: rgb.g * 0.6, b: rgb.b * 0.6,
        };
        const nType = noise.t;
        mat.onBeforeCompile = (shader) => {
            shader.uniforms.samScale = { value: scale };
            shader.uniforms.samAmp = { value: amp };
            shader.uniforms.samSeed = { value: seed * 0.17 };
            shader.uniforms.samCol2 = { value: new THREE.Vector3(col2.r, col2.g, col2.b) };
            shader.uniforms.samBands = { value: noise.bands || 0 };
            shader.uniforms.samRoughAmp = {
                value: noise.roughAmp != null ? noise.roughAmp
                     : (style === 'pbr' ? 0.35 : 0.15),
            };
            shader.vertexShader = shader.vertexShader
                .replace('#include <common>',
                    '#include <common>\nvarying vec3 samObjPos;')
                .replace('#include <begin_vertex>',
                    '#include <begin_vertex>\nsamObjPos = position;');
            let noiseFn = '_samFbm';
            if (nType === 'cell') noiseFn = '_samCell';
            else if (nType === 'scratch') noiseFn = '_samNoise';
            else if (nType === 'stripe') noiseFn = 'stripeN';
            else if (nType === 'spot') noiseFn = 'spotN';
            else if (nType === 'grain') noiseFn = '_samNoise';
            shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>',
                    '#include <common>\n' + NOISE_GLSL + `
varying vec3 samObjPos;
uniform float samScale, samAmp, samSeed, samBands, samRoughAmp;
uniform vec3 samCol2;
float stripeN(vec3 p){ return step(0.5, fract(p.x*0.5+samSeed)); }
float spotN(vec3 p){ return step(0.65, _samNoise(p)); }
`)
                .replace('#include <color_fragment>',
                    `#include <color_fragment>
{
  vec3 p = samObjPos * samScale + samSeed;
  float n = ${noiseFn}(p);
  if (samBands > 0.5) n = floor(n * samBands) / samBands;
  float t = clamp(n * samAmp * 2.0, 0.0, 1.0);
  diffuseColor.rgb = mix(diffuseColor.rgb, samCol2, t);
}
`);
            // La ruvidita' variabile e' cio' che distingue una superficie usata
            // da una verniciata a spruzzo: senza, il riflesso e' uniforme su
            // tutto il pezzo e il materiale sembra plastica.
            if (shader.fragmentShader.indexOf('#include <roughnessmap_fragment>') >= 0) {
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <roughnessmap_fragment>',
                    `#include <roughnessmap_fragment>
{
  float rn = ${noiseFn}(samObjPos * samScale * 1.7 + samSeed + 3.1);
  roughnessFactor = clamp(roughnessFactor + (rn - 0.5) * samRoughAmp, 0.03, 1.0);
}
`);
            }
        };
        mat.customProgramCacheKey = () => key;
    }

    mat.userData.samDef = def;
    mat.userData.samStyle = style;
    _matCache.set(key, mat);
    return mat;
}

function clearMaterialCache() {
    for (const m of _matCache.values()) {
        if (m && m.dispose) m.dispose();
    }
    _matCache.clear();
}

function meshToThree(mesh, mats, style) {
    if (meshIsEmpty(mesh)) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(
        mesh.pos instanceof Float32Array ? mesh.pos : new Float32Array(mesh.pos), 3));
    geo.setIndex(new THREE.BufferAttribute(
        mesh.idx instanceof Uint32Array ? mesh.idx : new Uint32Array(mesh.idx), 1));
    const normals = meshNormals(mesh);
    geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    const def = (mats && mesh.mat && mats[mesh.mat]) || { col: '#CCCCCC' };
    const mat = buildMaterial(def, style);
    const obj = new THREE.Mesh(geo, mat);
    obj.name = mesh.name || '';
    obj.userData.samMat = mesh.mat || '';
    obj.userData.samBone = mesh.bone || '';
    obj.castShadow = true;
    obj.receiveShadow = true;
    return obj;
}

// =======================================================================
//  08 - Scena Three.js: viewport, griglia, silhouette umana, luci
// =======================================================================

let renderer, scene, camera, controls, assetRoot, humanRef, gridHelper;
let _needsRender = true;
let currentBuilt = null;
let currentSpec = null;

function initScene() {
    const canvas = $('viewport');
    if (!canvas) return;
    const wrap = canvas.parentElement || document.body;

    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x0c0a14, 1);
    renderer.shadowMap.enabled = true;
    if (THREE.PCFSoftShadowMap !== undefined) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // Tone mapping: senza, i metalli e le luci speculari si bruciano a bianco e
    // il modello sembra sovraesposto. ACES e' quello che usano i motori di
    // gioco, quindi cio' che si vede qui somiglia a cio' che si vedra' la'.
    if (THREE.ACESFilmicToneMapping !== undefined) {
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
    }
    if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
    else if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, 1, 0.01, 500);
    camera.position.set(2.2, 1.6, 3.2);

    controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.8, 0);
    controls.addEventListener('change', () => { _needsRender = true; });

    // Luci: tre punti + rimbalzo da terra. Il rimbalzo non e' un vezzo — senza,
    // il sotto degli oggetti e' nero e la forma non si legge.
    const hemi = new THREE.HemisphereLight(0xc2d4ee, 0x3a3040, 0.55);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff4e6, 2.1);
    key.position.set(3, 6, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0008;
    key.shadow.normalBias = 0.02;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88aaff, 0.55);
    fill.position.set(-4, 2, -2);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffccaa, 0.7);
    rim.position.set(-1, 2.5, -5);
    scene.add(rim);
    const bounce = new THREE.DirectionalLight(0x6a7a90, 0.25);
    bounce.position.set(0, -3, 1);
    scene.add(bounce);

    // Piano che riceve l'ombra: da' appoggio visivo senza chiudere la scena.
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.35 });
    const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), shadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // Griglia
    gridHelper = new THREE.GridHelper(10, 20, 0x445566, 0x2a3040);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Asse Y leggero
    const axis = new THREE.AxesHelper(0.5);
    axis.position.y = 0.001;
    scene.add(axis);

    // Silhouette umana di riferimento (1.70 m)
    humanRef = buildHumanSilhouette();
    humanRef.visible = loadPref('showHuman', true);
    scene.add(humanRef);

    assetRoot = new THREE.Group();
    assetRoot.name = 'asset';
    scene.add(assetRoot);

    function resize() {
        const w = wrap.clientWidth || 800;
        const h = wrap.clientHeight || 600;
        renderer.setSize(w, h, false);
        camera.aspect = w / Math.max(1, h);
        camera.updateProjectionMatrix();
        _needsRender = true;
    }
    window.addEventListener('resize', resize);
    resize();

    function loop() {
        requestAnimationFrame(loop);
        const damping = controls.enableDamping;
        if (damping) controls.update();
        if (_needsRender || damping) {
            renderer.render(scene, camera);
            _needsRender = false;
        }
    }
    loop();
}

function buildHumanSilhouette() {
    // Sagoma stilizzata alta 1.70 m: capsule per corpo e arti.
    const g = new THREE.Group();
    g.name = 'humanRef';
    const mat = new THREE.MeshStandardMaterial({
        color: 0x6a7a90, transparent: true, opacity: 0.35,
        flatShading: true, depthWrite: false,
    });
    function add(mesh, x, y, z) {
        mesh.position.set(x, y, z);
        mesh.material = mat;
        g.add(mesh);
    }
    // torso
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.45, 4, 8), mat);
    add(torso, 0, 1.15, 0);
    // head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), mat);
    add(head, 0, 1.58, 0);
    // legs
    const leg = () => new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.55, 4, 8), mat);
    add(leg(), 0.09, 0.45, 0);
    add(leg(), -0.09, 0.45, 0);
    // arms (abbassate)
    const arm = () => new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.45, 4, 8), mat);
    const aR = arm(); aR.rotation.z = 0.15; add(aR, 0.28, 1.05, 0);
    const aL = arm(); aL.rotation.z = -0.15; add(aL, -0.28, 1.05, 0);
    // posiziona a lato: x positivo rispetto all'asset
    g.position.set(1.2, 0, 0);
    return g;
}

function clearAsset() {
    if (!assetRoot) return;
    while (assetRoot.children.length) {
        const c = assetRoot.children.pop();
        if (c.geometry) c.geometry.dispose();
        // materiali shared: non dispose qui
    }
}

function showSpec(spec) {
    currentSpec = spec;
    clearAsset();
    clearMaterialCache();
    if (!spec) {
        currentBuilt = null;
        _needsRender = true;
        return null;
    }
    const built = buildSpec(spec);
    currentBuilt = built;
    const style = spec.style || 'lowpoly';
    const mats = spec.mats || {};

    // Outline toon: guscio invertito leggero.
    for (const part of built.parts) {
        const mesh = meshToThree(part, mats, style);
        if (!mesh) continue;
        assetRoot.add(mesh);
        if (style === 'toon') {
            const outlineMat = new THREE.MeshBasicMaterial({
                color: 0x0a0a12, side: THREE.BackSide,
            });
            const outline = new THREE.Mesh(mesh.geometry, outlineMat);
            outline.scale.multiplyScalar(1.03);
            outline.name = mesh.name + '_outline';
            assetRoot.add(outline);
        }
    }

    // Adatta camera all'ingombro.
    fitCameraToAsset(built.bounds);
    // Sposta la silhouette accanto all'asset.
    if (humanRef) {
        const b = built.bounds;
        humanRef.position.x = b.max[0] + 0.6;
        humanRef.position.z = b.center[2];
    }
    _needsRender = true;
    return built;
}

function fitCameraToAsset(bounds) {
    if (!bounds || !camera) return;
    const size = bounds.size;
    const maxDim = Math.max(size[0], size[1], size[2], 0.5);
    const dist = maxDim * 2.4;
    const cx = bounds.center[0], cy = Math.max(bounds.center[1], size[1] * 0.4), cz = bounds.center[2];
    camera.position.set(cx + dist * 0.7, cy + dist * 0.45, cz + dist * 0.9);
    controls.target.set(cx, cy, cz);
    controls.update();
    camera.near = Math.max(0.01, maxDim / 100);
    camera.far = Math.max(100, maxDim * 50);
    camera.updateProjectionMatrix();
}

function setView(name) {
    if (!currentBuilt || !camera) return;
    const b = currentBuilt.bounds;
    const c = b.center;
    const d = Math.max(b.size[0], b.size[1], b.size[2], 0.5) * 2.2;
    const pos = {
        front:  [c[0], c[1], c[2] + d],
        back:   [c[0], c[1], c[2] - d],
        left:   [c[0] - d, c[1], c[2]],
        right:  [c[0] + d, c[1], c[2]],
        top:    [c[0], c[1] + d, c[2] + 0.01],
        persp:  [c[0] + d * 0.7, c[1] + d * 0.5, c[2] + d * 0.8],
    }[name] || [c[0] + d * 0.7, c[1] + d * 0.5, c[2] + d * 0.8];
    camera.position.set(pos[0], pos[1], pos[2]);
    controls.target.set(c[0], c[1], c[2]);
    controls.update();
    _needsRender = true;
}

/** Contact sheet: 6 viste in un unico canvas 2D, con silhouette umana. */
function renderContactSheet(opts) {
    opts = opts || {};
    const tileW = opts.tileW || 320;
    const tileH = opts.tileH || 240;
    const labels = ['front', 'back', 'left', 'right', 'top', 'persp'];
    const cols = 3, rows = 2;
    const sheet = document.createElement('canvas');
    sheet.width = tileW * cols;
    sheet.height = tileH * rows;
    const ctx = sheet.getContext('2d');
    ctx.fillStyle = '#0c0a14';
    ctx.fillRect(0, 0, sheet.width, sheet.height);

    // Salva stato camera.
    const savedPos = camera.position.clone();
    const savedTarget = controls.target.clone();
    const savedHuman = humanRef ? humanRef.visible : false;
    if (humanRef) humanRef.visible = true;

    const tmp = document.createElement('canvas');
    tmp.width = tileW; tmp.height = tileH;

    for (let i = 0; i < labels.length; i++) {
        setView(labels[i]);
        // Render offscreen: ridimensiona il renderer temporaneamente.
        const prevSize = new THREE.Vector2();
        renderer.getSize(prevSize);
        const prevPr = renderer.getPixelRatio();
        renderer.setPixelRatio(1);
        renderer.setSize(tileW, tileH, false);
        camera.aspect = tileW / tileH;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        // Copia i pixel.
        ctx.drawImage(renderer.domElement, 0, 0, tileW, tileH,
            (i % cols) * tileW, Math.floor(i / cols) * tileH, tileW, tileH);
        // Etichetta.
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect((i % cols) * tileW, Math.floor(i / cols) * tileH, 70, 18);
        ctx.fillStyle = '#cde';
        ctx.font = '12px sans-serif';
        ctx.fillText(labels[i], (i % cols) * tileW + 6, Math.floor(i / cols) * tileH + 13);
        // Ripristina size.
        renderer.setPixelRatio(prevPr);
        renderer.setSize(prevSize.x, prevSize.y, false);
        camera.aspect = prevSize.x / Math.max(1, prevSize.y);
        camera.updateProjectionMatrix();
    }

    // Scala metrica.
    if (currentBuilt) {
        const s = currentBuilt.bounds.size;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(8, sheet.height - 28, 220, 20);
        ctx.fillStyle = '#9cf';
        ctx.font = '11px monospace';
        ctx.fillText(
            'size ' + s[0].toFixed(2) + ' x ' + s[1].toFixed(2) + ' x ' + s[2].toFixed(2) + ' m  |  human 1.70 m',
            14, sheet.height - 14);
    }

    // Ripristina camera.
    camera.position.copy(savedPos);
    controls.target.copy(savedTarget);
    controls.update();
    if (humanRef) humanRef.visible = savedHuman;
    _needsRender = true;

    return sheet;
}

function contactSheetDataURL(opts) {
    const sheet = renderContactSheet(opts);
    return sheet.toDataURL('image/png');
}

// =======================================================================
//  09 - Export GLB / OBJ / JSON / collider sidecar
//
//  Invariante del padre: NESSUN attributo `color` nel GLB (COLOR_0 *
//  baseColorFactor = colore al quadrato). Rumore procedurale quantizzato
//  in sfumature piatte per materiale (un GLB non porta shader).
// =======================================================================

function downloadBlob(filename, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function downloadText(filename, text, mime) {
    downloadBlob(filename, new Blob([text], { type: mime || 'text/plain' }));
}

function quantizeColor(def, style) {
    // Per l'export: una sola tinta media (il rumore non si esporta come texture
    // in fase 1; si usa la base + un'eventuale col2 al 50%).
    if (!def) return { col: '#CCCCCC', rough: 0.7, metal: 0, emit: 0, opacity: 1 };
    let col = def.col || '#CCCCCC';
    if (def.noise && def.noise.col2) {
        const a = hexToRgb(col), b = hexToRgb(def.noise.col2);
        const t = (def.noise.amp != null ? def.noise.amp : 0.18);
        const mix = {
            r: a.r * (1 - t) + b.r * t,
            g: a.g * (1 - t) + b.g * t,
            b: a.b * (1 - t) + b.b * t,
        };
        const h = (n) => Math.max(0, Math.min(255, Math.round(n * 255))).toString(16).padStart(2, '0');
        col = '#' + h(mix.r) + h(mix.g) + h(mix.b);
    }
    return {
        col: col,
        rough: def.rough != null ? def.rough : 0.7,
        metal: def.metal || 0,
        emit: def.emit || 0,
        emitCol: def.emitCol,
        opacity: def.opacity != null ? def.opacity : 1,
    };
}

function exportGLB(spec, built, opts) {
    opts = opts || {};
    if (!built || !built.parts || !built.parts.length) {
        throw new Error('Niente da esportare.');
    }
    const root = new THREE.Group();
    root.name = (spec && spec.id) || 'asset';
    const style = (spec && spec.style) || 'lowpoly';
    const mats = (spec && spec.mats) || {};

    // Rig: gerarchia di parti rigide.
    const boneNodes = {};
    if (spec && spec.rig && spec.rig.length) {
        for (const b of spec.rig) {
            const g = new THREE.Group();
            g.name = b.b;
            const piv = b.piv || [0, 0, 0];
            // piv e' assoluto: come posizione del gruppo.
            g.position.set(
                typeof piv[0] === 'number' ? piv[0] : 0,
                typeof piv[1] === 'number' ? piv[1] : 0,
                typeof piv[2] === 'number' ? piv[2] : 0);
            boneNodes[b.b] = g;
        }
        // Parenting.
        for (const b of spec.rig) {
            const g = boneNodes[b.b];
            if (b.parent && boneNodes[b.parent]) {
                // Converti piv in locale del parent.
                const parent = boneNodes[b.parent];
                const pw = parent.position;
                g.position.sub(pw);
                parent.add(g);
            } else {
                root.add(g);
            }
        }
    }

    for (const part of built.parts) {
        const q = quantizeColor(mats[part.mat], style);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(
            part.pos instanceof Float32Array ? part.pos : new Float32Array(part.pos), 3));
        geo.setIndex(new THREE.BufferAttribute(
            part.idx instanceof Uint32Array ? part.idx : new Uint32Array(part.idx), 1));
        geo.setAttribute('normal', new THREE.BufferAttribute(meshNormals(part), 3));
        // NIENTE color attribute.
        const rgb = hexToRgb(q.col);
        const mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(rgb.r, rgb.g, rgb.b),
            roughness: q.rough,
            metalness: q.metal,
            flatShading: style === 'lowpoly',
            transparent: q.opacity < 1,
            opacity: q.opacity,
            side: THREE.FrontSide,
        });
        if (q.emit > 0) {
            const ec = q.emitCol ? hexToRgb(q.emitCol) : rgb;
            mat.emissive = new THREE.Color(ec.r, ec.g, ec.b);
            mat.emissiveIntensity = q.emit;
        }
        const mesh = new THREE.Mesh(geo, mat);
        mesh.name = part.name || 'part';

        // Se ha un bone, le posizioni sono world: le rendiamo locali al bone.
        if (part.bone && boneNodes[part.bone]) {
            const bone = boneNodes[part.bone];
            // Trasla i vertici di -pivot.
            const piv = bone.getWorldPosition(new THREE.Vector3());
            // bone.position e' gia' in root o parent; usiamo la sua pos locale
            // rispetto a root sommando la catena.
            let wx = 0, wy = 0, wz = 0;
            let n = bone;
            while (n && n !== root) {
                wx += n.position.x; wy += n.position.y; wz += n.position.z;
                n = n.parent;
            }
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setXYZ(i, pos.getX(i) - wx, pos.getY(i) - wy, pos.getZ(i) - wz);
            }
            pos.needsUpdate = true;
            geo.computeBoundingSphere();
            bone.add(mesh);
        } else {
            root.add(mesh);
        }
    }

    // Animazioni semplici (clips su bone nodes).
    const animations = [];
    if (spec && spec.clips) {
        for (const [cname, clip] of Object.entries(spec.clips)) {
            const tracks = [];
            const keys = clip.keys || [];
            // Per ogni bone, raccogli i keyframe di rotazione.
            const byBone = {};
            for (const k of keys) {
                const t = k[0];
                const poses = k[1] || {};
                for (const [bname, val] of Object.entries(poses)) {
                    if (!byBone[bname]) byBone[bname] = [];
                    let rot = val;
                    if (val && val.rot) rot = val.rot;
                    if (!Array.isArray(rot)) rot = [0, 0, 0];
                    byBone[bname].push({ t: t, rot: rot });
                }
            }
            const toR = Math.PI / 180;
            for (const [bname, frames] of Object.entries(byBone)) {
                if (!boneNodes[bname]) continue;
                frames.sort((a, b) => a.t - b.t);
                const times = frames.map(f => f.t);
                // Quaternion da Euler XYZ gradi.
                const values = [];
                for (const f of frames) {
                    const e = new THREE.Euler(
                        (f.rot[0] || 0) * toR,
                        (f.rot[1] || 0) * toR,
                        (f.rot[2] || 0) * toR, 'XYZ');
                    const q = new THREE.Quaternion().setFromEuler(e);
                    values.push(q.x, q.y, q.z, q.w);
                }
                tracks.push(new THREE.QuaternionKeyframeTrack(
                    bname + '.quaternion', times, values));
            }
            if (tracks.length) {
                animations.push(new THREE.AnimationClip(cname, clip.dur || -1, tracks));
            }
        }
    }

    return new Promise((resolve, reject) => {
        const exporter = new GLTFExporter();
        exporter.parse(root, (result) => {
            // dispose geo/mat temporanei
            root.traverse(o => {
                if (o.geometry) o.geometry.dispose();
                if (o.material) {
                    if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                    else o.material.dispose();
                }
            });
            if (result instanceof ArrayBuffer) {
                const blob = new Blob([result], { type: 'model/gltf-binary' });
                if (!opts.silent) downloadBlob(((spec && spec.id) || 'asset') + '.glb', blob);
                resolve(blob);
            } else {
                const text = JSON.stringify(result);
                if (!opts.silent) downloadText(((spec && spec.id) || 'asset') + '.gltf', text, 'model/gltf+json');
                resolve(text);
            }
        }, (err) => reject(err), {
            binary: opts.binary !== false,
            animations: animations,
            onlyVisible: true,
        });
    });
}

function exportOBJ(spec, built) {
    if (!built || !built.parts || !built.parts.length) throw new Error('Niente da esportare.');
    const mats = (spec && spec.mats) || {};
    let obj = '# SimpleAIModeller\n';
    let mtl = '# SimpleAIModeller MTL\n';
    const id = (spec && spec.id) || 'asset';
    obj += 'mtllib ' + id + '.mtl\n';
    const matNames = {};
    let vOff = 1;
    for (const part of built.parts) {
        const mkey = part.mat || 'default';
        if (!matNames[mkey]) {
            const q = quantizeColor(mats[mkey]);
            const rgb = hexToRgb(q.col);
            const safe = ('M_' + mkey).replace(/[^A-Za-z0-9_]/g, '_');
            matNames[mkey] = safe;
            mtl += 'newmtl ' + safe + '\n';
            mtl += 'Kd ' + rgb.r.toFixed(4) + ' ' + rgb.g.toFixed(4) + ' ' + rgb.b.toFixed(4) + '\n';
            mtl += 'Ns ' + Math.round((1 - q.rough) * 500) + '\n';
            if (q.opacity < 1) mtl += 'd ' + q.opacity.toFixed(3) + '\nillum 2\n';
            else mtl += 'illum 1\n';
            mtl += '\n';
        }
        obj += 'o ' + (part.name || 'part') + '\n';
        obj += 'usemtl ' + matNames[mkey] + '\n';
        const p = part.pos, idx = part.idx;
        const nrm = meshNormals(part);
        for (let i = 0; i < p.length; i += 3) {
            obj += 'v ' + p[i].toFixed(5) + ' ' + p[i + 1].toFixed(5) + ' ' + p[i + 2].toFixed(5) + '\n';
        }
        for (let i = 0; i < nrm.length; i += 3) {
            obj += 'vn ' + nrm[i].toFixed(5) + ' ' + nrm[i + 1].toFixed(5) + ' ' + nrm[i + 2].toFixed(5) + '\n';
        }
        for (let i = 0; i < idx.length; i += 3) {
            const a = idx[i] + vOff, b = idx[i + 1] + vOff, c = idx[i + 2] + vOff;
            obj += 'f ' + a + '//' + a + ' ' + b + '//' + b + ' ' + c + '//' + c + '\n';
        }
        vOff += (p.length / 3) | 0;
    }
    downloadText(id + '.obj', obj, 'text/plain');
    setTimeout(() => downloadText(id + '.mtl', mtl, 'text/plain'), 200);
}

function exportJSON(spec) {
    const id = (spec && spec.id) || 'asset';
    downloadText(id + '.sam.json', JSON.stringify(spec, null, 2), 'application/json');
}

function exportColliders(spec) {
    const id = (spec && spec.id) || 'asset';
    const data = {
        id: id,
        unit: 'm',
        up: 'y',
        colliders: (spec && spec.col) || [],
    };
    downloadText(id + '.colliders.json', JSON.stringify(data, null, 2), 'application/json');
}

// =======================================================================
//  09b - ZIP scritto a mano (store, nessuna dipendenza)
//
//  Serve perche' i browser BLOCCANO i download multipli: un bundle
//  GLB + spec + collider + README deve uscire come UN file. Store mode
//  (nessuna compressione) perche' un GLB e' gia' compresso e implementare
//  deflate a mano costerebbe piu' di quanto risparmierebbe.
//
//  La data e' FISSA di proposito: un timestamp reale renderebbe due export
//  dello stesso asset binariamente diversi, e si perderebbe la possibilita'
//  di dire "e' cambiato qualcosa?" confrontando i file.
// =======================================================================

function _crc32(buf) {
    let table = _crc32.table;
    if (!table) {
        table = _crc32.table = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
            let c = i;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            table[i] = c >>> 0;
        }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) crc = table[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
}

const ZIP_TIME = 0;
const ZIP_DATE = 33;      // 1980-01-01

function zipBuild(entries) {
    const enc = new TextEncoder();
    const files = [];
    for (const e of entries) {
        const nameBytes = enc.encode(e.name);
        const data = (e.data instanceof Uint8Array) ? e.data
            : (e.data instanceof ArrayBuffer) ? new Uint8Array(e.data)
            : enc.encode(String(e.data));
        files.push({ nameBytes: nameBytes, data: data, crc: _crc32(data) });
    }
    let localSize = 0, centralSize = 0;
    for (const f of files) {
        localSize += 30 + f.nameBytes.length + f.data.length;
        centralSize += 46 + f.nameBytes.length;
    }
    const out = new Uint8Array(localSize + centralSize + 22);
    const dv = new DataView(out.buffer);
    let off = 0;
    const offsets = [];

    for (const f of files) {
        offsets.push(off);
        dv.setUint32(off, 0x04034b50, true); off += 4;
        dv.setUint16(off, 20, true); off += 2;              // versione minima
        dv.setUint16(off, 0, true); off += 2;               // flag
        dv.setUint16(off, 0, true); off += 2;               // metodo 0 = store
        dv.setUint16(off, ZIP_TIME, true); off += 2;
        dv.setUint16(off, ZIP_DATE, true); off += 2;
        dv.setUint32(off, f.crc, true); off += 4;
        dv.setUint32(off, f.data.length, true); off += 4;   // compressa
        dv.setUint32(off, f.data.length, true); off += 4;   // originale
        dv.setUint16(off, f.nameBytes.length, true); off += 2;
        dv.setUint16(off, 0, true); off += 2;               // extra
        out.set(f.nameBytes, off); off += f.nameBytes.length;
        out.set(f.data, off); off += f.data.length;
    }

    const centralStart = off;
    for (let i = 0; i < files.length; i++) {
        const f = files[i];
        dv.setUint32(off, 0x02014b50, true); off += 4;
        dv.setUint16(off, 20, true); off += 2;              // versione creatore
        dv.setUint16(off, 20, true); off += 2;              // versione minima
        dv.setUint16(off, 0, true); off += 2;               // flag
        dv.setUint16(off, 0, true); off += 2;               // metodo
        dv.setUint16(off, ZIP_TIME, true); off += 2;
        dv.setUint16(off, ZIP_DATE, true); off += 2;
        dv.setUint32(off, f.crc, true); off += 4;
        dv.setUint32(off, f.data.length, true); off += 4;
        dv.setUint32(off, f.data.length, true); off += 4;
        dv.setUint16(off, f.nameBytes.length, true); off += 2;
        dv.setUint16(off, 0, true); off += 2;               // extra
        dv.setUint16(off, 0, true); off += 2;               // commento
        dv.setUint16(off, 0, true); off += 2;               // disco
        dv.setUint16(off, 0, true); off += 2;               // attributi interni
        dv.setUint32(off, 0, true); off += 4;               // attributi esterni
        dv.setUint32(off, offsets[i], true); off += 4;      // offset locale
        out.set(f.nameBytes, off); off += f.nameBytes.length;
    }
    const centralBytes = off - centralStart;

    dv.setUint32(off, 0x06054b50, true); off += 4;
    dv.setUint16(off, 0, true); off += 2;                   // disco
    dv.setUint16(off, 0, true); off += 2;                   // disco del central
    dv.setUint16(off, files.length, true); off += 2;
    dv.setUint16(off, files.length, true); off += 2;
    dv.setUint32(off, centralBytes, true); off += 4;
    dv.setUint32(off, centralStart, true); off += 4;
    dv.setUint16(off, 0, true); off += 2;                   // commento
    return out;
}

/** Bundle completo: GLB + spec + piano + collider + istruzioni. */
async function exportBundle(spec, built, plan) {
    const id = (spec && spec.id) || 'asset';
    const glb = await exportGLB(spec, built, { silent: true, binary: true });
    const glbBytes = new Uint8Array(await glb.arrayBuffer());
    const entries = [
        { name: id + '.glb', data: glbBytes },
        { name: id + '.sam.json', data: JSON.stringify(spec, null, 2) },
        { name: id + '.colliders.json', data: JSON.stringify({
            id: id, unit: 'm', up: 'y', colliders: (spec && spec.col) || [],
        }, null, 2) },
        { name: 'LEGGIMI.txt', data: bundleReadme(spec, built, plan) },
    ];
    if (plan) {
        entries.push({ name: id + '.plan.json', data: JSON.stringify(plan, null, 2) });
    }
    const zip = zipBuild(entries);
    downloadBlob(id + '.zip', new Blob([zip], { type: 'application/zip' }));
    return zip.length;
}

function bundleReadme(spec, built, plan) {
    const b = built ? built.bounds : null;
    const L = [];
    L.push('Asset generato con SimpleAIModeller');
    L.push('');
    L.push('id        : ' + ((spec && spec.id) || '?'));
    L.push('categoria : ' + ((spec && spec.cat) || '?'));
    L.push('stile     : ' + ((spec && spec.style) || '?'));
    if (b) {
        L.push('ingombro  : ' + b.size.map(v => v.toFixed(4)).join(' x ') + ' m');
    }
    L.push('nodi      : ' + ((spec && spec.nodes && spec.nodes.length) || 0));
    L.push('triangoli : ' + (built ? meshTriCount(built.merged) : 0));
    L.push('');
    L.push('CONVENZIONI');
    L.push('  unita = metri, Y in alto, fronte verso +Z');
    L.push('  pivot al centro della base (personaggi: ai piedi)');
    L.push('  ogni nodo e una mesh nominata: leve, coperchi e ruote si animano');
    L.push('');
    L.push('FILE');
    L.push('  .glb            modello (Unity/Godot/Blender)');
    L.push('  .sam.json       spec parametrica: riapribile e modificabile');
    L.push('  .plan.json      distinta di misure verificata');
    L.push('  .colliders.json forme di collisione (box/sfere/capsule)');
    if (plan) {
        L.push('');
        L.push('PIANO DELLE MISURE');
        L.push('  asse ' + plan.axis.toUpperCase() + ', lunghezza '
               + plan.axisLength.toFixed(4) + ' m');
        for (const s of plan.chain) {
            L.push('  ' + s.n.padEnd(18) + s.from.toFixed(4) + ' -> ' + s.to.toFixed(4));
        }
    }
    return L.join('\n');
}

// =======================================================================
//  09c - Import: spec .sam.json, GLB/OBJ come RIFERIMENTO
//
//  Due cose diverse e non vanno confuse:
//   - una spec si RIAPRE (torna modificabile, parametri compresi);
//   - una mesh esterna non e' convertibile in spec parametrica, quindi
//     entra come RIFERIMENTO: si vede accanto/sovrapposta e serve a
//     confrontare proporzioni. Fingere di importarla come nodi darebbe un
//     asset non piu' modificabile che sembra modificabile.
// =======================================================================

let referenceObj = null;

async function importSpecFile(file) {
    const text = await file.text();
    let raw;
    try {
        raw = JSON.parse(text);
    } catch (e) {
        throw new Error(t('err.badJson'));
    }
    // Passa dal server: normalizza, avvisa, e riempie i default. Farlo qui
    // duplicherebbe `normalize_spec`.
    const data = await apiPost('/api/asset/normalize', { spec: raw });
    return data;
}

async function importReferenceFile(file) {
    const name = (file.name || '').toLowerCase();
    const buf = await file.arrayBuffer();
    clearReference();
    if (name.endsWith('.glb') || name.endsWith('.gltf')) {
        const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
        const loader = new GLTFLoader();
        return new Promise((resolve, reject) => {
            loader.parse(buf, '', (gltf) => {
                referenceObj = gltf.scene;
                prepareReference(referenceObj);
                resolve(referenceInfo());
            }, reject);
        });
    }
    if (name.endsWith('.obj')) {
        const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
        const loader = new OBJLoader();
        const txt = new TextDecoder().decode(buf);
        referenceObj = loader.parse(txt);
        prepareReference(referenceObj);
        return referenceInfo();
    }
    throw new Error(t('err.unsupportedFile', { name: file.name }));
}

function prepareReference(obj) {
    const mat = new THREE.MeshStandardMaterial({
        color: 0x4f8cff, transparent: true, opacity: 0.28,
        roughness: 0.8, depthWrite: false, side: THREE.DoubleSide,
    });
    obj.traverse((c) => {
        if (c.isMesh) {
            c.material = mat;
            c.castShadow = false;
            c.receiveShadow = false;
        }
    });
    obj.name = 'reference';
    scene.add(obj);
    _needsRender = true;
}

function referenceInfo() {
    if (!referenceObj) return null;
    const box = new THREE.Box3().setFromObject(referenceObj);
    const size = new THREE.Vector3();
    box.getSize(size);
    return { size: [size.x, size.y, size.z], min: box.min.toArray() };
}

function clearReference() {
    if (!referenceObj) return;
    scene.remove(referenceObj);
    referenceObj.traverse((c) => {
        if (c.geometry) c.geometry.dispose();
        if (c.material && c.material.dispose) c.material.dispose();
    });
    referenceObj = null;
    _needsRender = true;
}

/** Trascinamento su tutta la finestra: la via piu' rapida per aprire un file. */
function wireDragDrop() {
    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };
    window.addEventListener('dragover', (e) => {
        stop(e);
        document.body.classList.add('dragging');
    });
    window.addEventListener('dragleave', (e) => {
        stop(e);
        document.body.classList.remove('dragging');
    });
    window.addEventListener('drop', async (e) => {
        stop(e);
        document.body.classList.remove('dragging');
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        await openAnyFile(file);
    });
}

async function openAnyFile(file) {
    const name = (file.name || '').toLowerCase();
    try {
        if (name.endsWith('.json')) {
            const data = await importSpecFile(file);
            appState.plan = null;
            renderPlan(null);
            pushHistory();
            const built = showSpec(data.spec);
            appState.spec = data.spec;
            appState.built = built;
            const defects = validateAll(data.spec, built, { hasPlan: false });
            showSpecInUi(data.spec, built, defects);
            setStatus(t('status.imported', { name: file.name }), 'ok');
        } else {
            const info = await importReferenceFile(file);
            setStatus(t('status.reference', {
                name: file.name,
                size: info ? info.size.map(v => v.toFixed(2)).join(' x ') : '?',
            }), 'ok');
        }
    } catch (e) {
        setStatus(t('err.generic', { msg: e.message || e }), 'error');
    }
}

// =======================================================================
//  09d - Editor: selezione, gizmo, undo/redo, scorciatoie
//
//  Il gizmo scrive NELLA SPEC, non sulla scena: spostare una mesh e
//  lasciare la spec com'era darebbe un modello che al primo rebuild torna
//  dov'era, e un export che non corrisponde a cio' che si vede.
//
//  Un nodo mosso a mano viene marcato `locked`: l'audit lo salta, perche'
//  la posizione scelta dall'utente non e' un errore del modello. Senza
//  questo, il ratchet "correggerebbe" ogni modifica manuale al giro dopo.
// =======================================================================

let gizmo = null;
let selectedName = '';
let selectedMesh = null;
let gizmoMode = 'translate';
let historyStack = [];
let historyIndex = -1;
const HISTORY_MAX = 60;

function currentSnap() {
    return JSON.stringify({ spec: appState.spec, plan: appState.plan });
}

function pushHistory() {
    if (!appState.spec) return;
    const snap = currentSnap();
    // Una modifica nuova azzera il redo: tenere un futuro che non discende
    // dal presente e' il modo classico di far ricomparire roba cancellata.
    if (historyIndex < historyStack.length - 1) {
        historyStack = historyStack.slice(0, historyIndex + 1);
    }
    if (historyStack.length && historyStack[historyStack.length - 1] === snap) return;
    historyStack.push(snap);
    if (historyStack.length > HISTORY_MAX) historyStack.shift();
    historyIndex = historyStack.length - 1;
}

function restoreHistory(delta) {
    const target = historyIndex + delta;
    if (target < 0 || target >= historyStack.length) return false;
    historyIndex = target;
    const snap = JSON.parse(historyStack[historyIndex]);
    appState.spec = snap.spec;
    appState.plan = snap.plan;
    renderPlan(appState.plan);
    const built = showSpec(appState.spec);
    appState.built = built;
    const defects = validateAll(appState.spec, built, { hasPlan: !!appState.plan });
    showSpecInUi(appState.spec, built, defects);
    selectNode(selectedName, true);
    return true;
}

/**
 * `pushHistory` registra lo stato PRIMA della modifica (e' il punto in cui si
 * torna), quindi lo stato ATTUALE non e' ancora nello stack. Se si annullasse
 * subito, si salterebbe indietro di due passi: il primo undo dopo un'azione
 * riporterebbe allo stato precedente a quello precedente. Qui, prima di
 * scendere, si deposita lo stato attuale in cima — cosi' esiste anche un futuro
 * a cui il redo puo' tornare.
 */
function undo() {
    if (!appState.spec || !historyStack.length) return;
    const cur = currentSnap();
    if (historyIndex === historyStack.length - 1 && historyStack[historyIndex] !== cur) {
        historyStack.push(cur);
        historyIndex = historyStack.length - 1;
        if (historyStack.length > HISTORY_MAX) {
