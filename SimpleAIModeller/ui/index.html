<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleAIModeller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
:root {
  --bg: #0c0a14;
  --bg2: #14101f;
  --panel: rgba(255,255,255,0.04);
  --panel-border: rgba(255,255,255,0.08);
  --text: #e8e6f0;
  --muted: #9a96a8;
  --accent: #7c6af7;
  --accent2: #4f8cff;
  --ok: #3ecf8e;
  --warn: #e6b84d;
  --err: #e85d6a;
  --input: rgba(0,0,0,0.35);
  --radius: 10px;
  --font: "Plus Jakarta Sans", system-ui, sans-serif;
  --sidebar-w: 340px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--panel-border); background: var(--panel); border-radius: 8px; padding: 8px 12px; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
input, select, textarea {
  background: var(--input); border: 1px solid var(--panel-border); border-radius: 8px;
  padding: 8px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field { margin-bottom: 10px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.muted { color: var(--muted); font-size: 12px; }

.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr 300px; height: 100vh; }
.sidebar, .right {
  background: var(--bg2); border-right: 1px solid var(--panel-border);
  overflow: auto; padding: 14px;
}
.right { border-right: none; border-left: 1px solid var(--panel-border); }
.brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
.brand h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
.brand span { font-size: 11px; color: var(--muted); }
.section { margin-bottom: 16px; }
.section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn-row button { flex: 1 1 auto; }

.viewport-wrap { position: relative; background: var(--bg); min-width: 0; }
#viewport { width: 100%; height: 100%; display: block; }
.hud {
  position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; flex-wrap: wrap;
  background: rgba(18,15,30,0.92); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 4px;
}
.hud button { padding: 4px 8px; font-size: 12px; }
.hud-tools { top: 52px; }
.hud-tools button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
.hud-sep { width: 1px; background: var(--panel-border); margin: 2px 3px; }
.sel-info {
  position: absolute; right: 10px; top: 10px; max-width: 40%;
  background: rgba(18,15,30,0.92); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted);
  font-family: ui-monospace, monospace;
}
body.dragging::after {
  content: ''; position: fixed; inset: 0; z-index: 60; pointer-events: none;
  border: 3px dashed var(--accent); background: rgba(124,106,247,0.08);
}
#nodesList li { cursor: pointer; }
#nodesList li:hover { background: var(--panel); }
#nodesList li.selected {
  background: linear-gradient(90deg, rgba(124,106,247,0.25), transparent);
  border-left: 3px solid var(--accent); padding-left: 5px;
}
.status {
  position: absolute; left: 10px; right: 10px; bottom: 10px;
  background: rgba(18,15,30,0.92); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 8px 12px; font-size: 13px; min-height: 20px;
}
.status[data-kind="error"] { border-color: var(--err); color: #ffb3ba; }
.status[data-kind="warn"] { border-color: var(--warn); color: #ffe0a0; }
.status[data-kind="ok"] { border-color: var(--ok); color: #b6f0d0; }
.status[data-kind="busy"] { border-color: var(--accent); }

#nodesList, #defectsList, #providerList { list-style: none; margin: 0; padding: 0; font-size: 12px; }
#nodesList li, #providerList li {
  padding: 6px 8px; border-bottom: 1px solid var(--panel-border); font-family: ui-monospace, monospace;
}
#defectsList li { padding: 8px; border-left: 3px solid var(--muted); margin-bottom: 6px; background: var(--panel); border-radius: 0 6px 6px 0; }
#defectsList li.sev-high { border-left-color: var(--err); }
#defectsList li.sev-medium { border-left-color: var(--warn); }
#defectsList li.sev-low { border-left-color: var(--accent2); }
#defectsList li.ok { border-left-color: var(--ok); }
#defectsList .fix { color: var(--muted); font-size: 11px; margin-top: 2px; }

.param-row { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; margin-bottom: 4px; }
.param-row label { margin: 0; font-family: ui-monospace, monospace; }
#jsonOut { width: 100%; min-height: 160px; font-family: ui-monospace, monospace; font-size: 11px; resize: vertical; }
#statsOut { font-size: 12px; color: var(--muted); }
.plan-box {
  font-family: ui-monospace, monospace; font-size: 10.5px; line-height: 1.45;
  white-space: pre; overflow-x: auto; margin: 0; color: var(--text);
  background: var(--input); border: 1px solid var(--panel-border);
  border-radius: 8px; padding: 8px; max-height: 240px; overflow-y: auto;
}

.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex;
  align-items: center; justify-content: center; z-index: 50;
}
.modal[hidden] { display: none; }
.modal-card {
  background: var(--bg2); border: 1px solid var(--panel-border); border-radius: 12px;
  width: min(560px, 92vw); max-height: 86vh; overflow: auto; padding: 18px;
}
.modal-card h2 { margin: 0 0 12px; font-size: 16px; }
#cookiesInput { min-height: 120px; font-family: ui-monospace, monospace; font-size: 11px; }

#busyOverlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 40;
  display: flex; align-items: center; justify-content: center; pointer-events: none;
}
#busyOverlay[hidden] { display: none; }
.spinner {
  width: 42px; height: 42px; border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
.check input { width: auto; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 300px 1fr; }
  .right { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1 data-i18n="app.title">SimpleAIModeller</h1>
      <span data-i18n="app.tagline">Asset 3D parametrici da prompt</span>
    </div>

    <div class="section">
      <div class="field">
        <label data-i18n="form.prompt">Descrivi l'asset</label>
        <textarea id="promptInput" rows="4" data-i18n-placeholder="form.promptPh"
          placeholder="Es. una cassa di legno con coperchio apribile e fasce di ferro"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label data-i18n="form.cat">Categoria</label>
          <select id="catSelect">
            <option value="prop" data-i18n="form.cat.prop">Prop / oggetto</option>
            <option value="char" data-i18n="form.cat.char">Personaggio</option>
            <option value="vehicle" data-i18n="form.cat.vehicle">Veicolo</option>
            <option value="struct" data-i18n="form.cat.struct">Struttura</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="form.style">Stile</label>
          <select id="styleSelect">
            <option value="lowpoly" data-i18n="form.style.lowpoly">Low-poly</option>
            <option value="pbr" data-i18n="form.style.pbr">PBR</option>
            <option value="toon" data-i18n="form.style.toon">Toon</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label data-i18n="form.detail">Dettaglio</label>
          <select id="detailSelect">
            <option value="0" data-i18n="form.detail.0">Bozza</option>
            <option value="1" data-i18n="form.detail.1">Basso</option>
            <option value="2" selected data-i18n="form.detail.2">Medio</option>
            <option value="3" data-i18n="form.detail.3">Alto</option>
          </select>
        </div>
        <div class="field">
          <label data-i18n="form.sizeHint">Ingombro suggerito (m, 0 = decide l'AI)</label>
          <div class="row">
            <input id="sizeX" type="number" step="0.1" min="0" value="0" title="X">
            <input id="sizeY" type="number" step="0.1" min="0" value="0" title="Y">
            <input id="sizeZ" type="number" step="0.1" min="0" value="0" title="Z">
          </div>
        </div>
      </div>
      <div class="field">
        <label data-i18n="form.model">Modello</label>
        <select id="modelSelect"></select>
        <div class="muted" id="modelNote"></div>
      </div>
      <label class="check"><input type="checkbox" id="groundCheck" checked> <span data-i18n="form.ground">Appoggiato a terra</span></label>
      <label class="check"><input type="checkbox" id="planCheck" checked> <span data-i18n="form.plan">Piano dell'architetto (consigliato)</span></label>
      <label class="check"><input type="checkbox" id="autofixCheck" checked> <span data-i18n="form.autofix">Correzione automatica delle misure</span></label>
      <label class="check"><input type="checkbox" id="visionCheck" checked> <span data-i18n="form.vision">Critica visiva AI</span></label>
      <div class="muted" id="visionStatus"></div>
      <div class="field">
        <label data-i18n="form.notes">Note</label>
        <input id="notesInput" data-i18n-placeholder="form.notesPh" placeholder="Vincoli extra, palette, riferimenti…">
      </div>
      <div class="btn-row">
        <button class="primary" id="generateBtn" data-i18n="btn.generate">Genera</button>
        <button id="demoBtn" data-i18n="btn.demo">Demo (senza AI)</button>
      </div>
      <div class="btn-row">
        <button id="critiqueBtn" data-i18n="btn.critique">Critica</button>
        <button id="patchBtn" data-i18n="btn.patch">Correggi…</button>
        <button id="settingsBtn" data-i18n="btn.settings">Impostazioni</button>
      </div>
    </div>

    <div class="section">
      <h2 data-i18n="panel.params">Parametri</h2>
      <div id="paramsList"></div>
    </div>

    <div class="section">
      <h2 data-i18n="nav.export">Esporta</h2>
      <div class="btn-row">
        <button id="exportBundleBtn" class="primary" data-i18n="btn.exportBundle">Bundle ZIP</button>
      </div>
      <div class="btn-row">
        <button id="exportGlbBtn" data-i18n="btn.exportGlb">GLB</button>
        <button id="exportObjBtn" data-i18n="btn.exportObj">OBJ</button>
        <button id="exportJsonBtn" data-i18n="btn.exportJson">JSON</button>
        <button id="exportColBtn" data-i18n="btn.exportCol">Collider</button>
      </div>
      <div class="btn-row">
        <button id="sheetBtn" data-i18n="btn.sheet">Contact sheet</button>
        <button id="importBtn" data-i18n="btn.import">Importa…</button>
      </div>
      <input type="file" id="importInput" accept=".json,.glb,.gltf,.obj" hidden>
      <div class="btn-row">
        <button id="clearRefBtn" data-i18n="btn.clearRef">Togli riferimento</button>
      </div>
      <label class="check"><input type="checkbox" id="humanCheck" checked> <span data-i18n="form.human">Silhouette 1,70 m</span></label>
      <div class="field" style="margin-top:10px">
        <label data-i18n="form.lang">Lingua</label>
        <select id="languageSelect"></select>
      </div>
    </div>
  </aside>

  <main class="viewport-wrap">
    <canvas id="viewport"></canvas>
    <div class="hud">
      <button data-view="front" data-i18n="view.front">Fronte</button>
      <button data-view="back" data-i18n="view.back">Retro</button>
      <button data-view="left" data-i18n="view.left">Sinistra</button>
      <button data-view="right" data-i18n="view.right">Destra</button>
      <button data-view="top" data-i18n="view.top">Alto</button>
      <button data-view="persp" data-i18n="view.persp">Prospettiva</button>
    </div>
    <div class="hud hud-tools">
      <button data-gizmo="translate" title="G" data-i18n="btn.move">Sposta</button>
      <button data-gizmo="rotate" title="R" data-i18n="btn.rotate">Ruota</button>
      <button data-gizmo="scale" title="S" data-i18n="btn.scale">Scala</button>
      <span class="hud-sep"></span>
      <button id="undoBtn" title="Ctrl+Z" data-i18n="btn.undo">Annulla</button>
      <button id="redoBtn" title="Ctrl+Y" data-i18n="btn.redo">Ripeti</button>
      <span class="hud-sep"></span>
      <button id="dupNodeBtn" title="Ctrl+D" data-i18n="btn.duplicate">Duplica</button>
      <button id="deleteNodeBtn" title="Del" data-i18n="btn.delete">Elimina</button>
      <button id="wireBtn" title="W" data-i18n="btn.wire">Wireframe</button>
    </div>
    <div class="sel-info" id="selInfo"></div>
    <div class="status" id="statusBar"></div>
  </main>

  <aside class="right">
    <div class="section">
      <h2 data-i18n="panel.stats">Statistiche</h2>
      <div id="statsOut" class="muted">—</div>
    </div>
    <div class="section">
      <h2 data-i18n="panel.plan">Piano delle misure</h2>
      <pre id="planOut" class="plan-box">—</pre>
    </div>
    <div class="section">
      <h2 data-i18n="panel.nodes">Nodi</h2>
      <ul id="nodesList"></ul>
    </div>
    <div class="section">
      <h2 data-i18n="panel.defects">Difetti</h2>
      <ul id="defectsList"></ul>
    </div>
    <div class="section">
      <h2 data-i18n="panel.json">Spec JSON</h2>
      <textarea id="jsonOut" spellcheck="false"></textarea>
      <div class="btn-row">
        <button id="applyJsonBtn" data-i18n="btn.applyJson">Applica JSON</button>
      </div>
    </div>
  </aside>
</div>

<div id="busyOverlay" hidden><div class="spinner" title="busy"></div></div>

<div class="modal" id="settingsModal" hidden>
  <div class="modal-card">
    <h2 data-i18n="settings.title">Impostazioni</h2>
    <p id="settingsInfo" class="muted"></p>
    <div class="field">
      <label data-i18n="settings.cookies">Cookie Gemini (JSON)</label>
      <textarea id="cookiesInput" data-i18n-placeholder="settings.cookiesPh"
        placeholder="Incolla qui l'export dei cookie del browser…"></textarea>
    </div>
    <div class="btn-row">
      <button class="primary" id="saveCookiesBtn" data-i18n="btn.saveCookies">Salva cookie</button>
      <button id="probeVisionBtn" data-i18n="btn.probeVision">Prova visione</button>
      <button id="settingsClose" data-i18n="btn.close">Chiudi</button>
    </div>
    <div class="section" style="margin-top:16px">
      <h2 data-i18n="settings.providers">Provider AI</h2>
      <ul id="providerList"></ul>
      <p class="muted">I provider si aggiungono anche da VoxelAIArtist: il registro e le chiavi sono condivisi.</p>
    </div>
  </div>
</div>

<script type="module">
// GENERATO da ui/build.mjs - NON modificare a mano.
// Modifica i moduli in ui/src/** e poi rilancia: node ui/build.mjs
// =======================================================================
//  00 - Bootstrap: carica THREE via importmap e apre la closure
//
//  I moduli di lib/ sono frammenti di UNA sola closure (niente import/
//  export fra di loro). THREE arriva da import() dinamico e viene
//  catturato come `const THREE` nello scope condiviso.
// =======================================================================

(async function SimpleAIModellerMain() {
    'use strict';

    let THREE, OrbitControls, GLTFExporter, TransformControls;
    try {
        const threeMod = await import('three');
        THREE = threeMod;
        const oc = await import('three/addons/controls/OrbitControls.js');
        OrbitControls = oc.OrbitControls;
        const ge = await import('three/addons/exporters/GLTFExporter.js');
        GLTFExporter = ge.GLTFExporter;
        try {
            const tc = await import('three/addons/controls/TransformControls.js');
            TransformControls = tc.TransformControls;
        } catch (e) { /* opzionale in fase 1 */ }
    } catch (e) {
        console.error('[sam] impossibile caricare Three.js:', e);
        document.body.innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#fff;background:#111">'
            + '<h1>Three.js non caricato</h1><p>Serve rete al primo avvio (CDN). '
            + 'Dettaglio: ' + String(e.message || e) + '</p></div>';
        return;
    }

    // Helpers DOM usati da tutti i moduli.
    function $(id) { return document.getElementById(id); }
    function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }

    // Preferenze minime (localStorage).
    function loadPref(k, d) {
        try {
            const v = localStorage.getItem('sam-' + k);
            return v == null ? d : JSON.parse(v);
        } catch (e) { return d; }
    }
    function savePref(k, v) {
        try { localStorage.setItem('sam-' + k, JSON.stringify(v)); } catch (e) { /* quota */ }
    }

    function requestRender() {
        if (typeof _needsRender !== 'undefined') _needsRender = true;
    }

// =======================================================================
//  01 - Espressioni numeriche (niente eval)
//
//  Un valore della spec e' un numero oppure una stringa tipo "h*0.5+t".
//  Si valuta con shunting-yard: tokenizer -> RPN -> stack. Niente `eval`,
//  niente `Function()`: un identificatore sconosciuto e' 0, non un
//  ReferenceError che ammazza il bootstrap.
//
//  Funzioni e costanti devono restare allineate a `EXPR_FUNCS`/`EXPR_CONSTS`
//  in SimpleAIModeller/src/spec.py: il server le usa per avvisare dei
//  parametri ignoti, qui per calcolare. Un test di parita' le confronta.
// =======================================================================

const EXPR_CONSTS = {
    PI: Math.PI,
    TAU: Math.PI * 2,
    E: Math.E,
    SQRT2: Math.SQRT2,
};

const EXPR_FUNCS = {
    min: Math.min,
    max: Math.max,
    abs: Math.abs,
    sqrt: Math.sqrt,
    sin: Math.sin,
    cos: Math.cos,
    tan: Math.tan,
    floor: Math.floor,
    ceil: Math.ceil,
    round: Math.round,
    sign: Math.sign,
    pow: Math.pow,
    mod: (a, b) => a % b,
    clamp: (x, lo, hi) => Math.min(hi, Math.max(lo, x)),
    lerp: (a, b, t) => a + (b - a) * t,
};

const EXPR_PREC = {
    '+': 1, '-': 1,
    '*': 2, '/': 2, '%': 2,
    'u-': 3, 'u+': 3,       // unari
    '^': 4,
};

function exprTokenize(src) {
    const s = String(src);
    const out = [];
    let i = 0;
    while (i < s.length) {
        const c = s[i];
        if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
        if ((c >= '0' && c <= '9') || (c === '.' && i + 1 < s.length && s[i + 1] >= '0' && s[i + 1] <= '9')) {
            let j = i + 1;
            while (j < s.length && ((s[j] >= '0' && s[j] <= '9') || s[j] === '.' || s[j] === 'e' || s[j] === 'E')) {
                if ((s[j] === 'e' || s[j] === 'E') && j + 1 < s.length && (s[j + 1] === '+' || s[j + 1] === '-')) j++;
                j++;
            }
            out.push({ t: 'num', v: parseFloat(s.slice(i, j)) });
            i = j;
            continue;
        }
        if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || c === '_') {
            let j = i + 1;
            while (j < s.length && ((s[j] >= 'A' && s[j] <= 'Z') || (s[j] >= 'a' && s[j] <= 'z')
                    || (s[j] >= '0' && s[j] <= '9') || s[j] === '_')) j++;
            out.push({ t: 'id', v: s.slice(i, j) });
            i = j;
            continue;
        }
        if (c === ',' || c === '(' || c === ')') {
            out.push({ t: c });
            i++;
            continue;
        }
        if (c === '+' || c === '-' || c === '*' || c === '/' || c === '%' || c === '^') {
            out.push({ t: 'op', v: c });
            i++;
            continue;
        }
        // Carattere ignoto: si salta invece di far fallire tutta l'espressione.
        i++;
    }
    return out;
}

function exprToRpn(tokens) {
    const out = [];
    const ops = [];
    let prev = null;        // per distinguere unario da binario
    for (let i = 0; i < tokens.length; i++) {
        const tok = tokens[i];
        if (tok.t === 'num') {
            out.push(tok);
            prev = 'val';
        } else if (tok.t === 'id') {
            // funzione se seguita da '('
            if (i + 1 < tokens.length && tokens[i + 1].t === '(') {
                ops.push({ t: 'fn', v: tok.v });
            } else {
                out.push(tok);
            }
            prev = 'val';
        } else if (tok.t === ',') {
            while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
            prev = 'sep';
        } else if (tok.t === 'op') {
            let op = tok.v;
            if ((prev === null || prev === 'op' || prev === 'sep' || prev === '(')
                    && (op === '-' || op === '+')) {
                op = 'u' + op;
            }
            const prec = EXPR_PREC[op] || 0;
            const right = (op === '^' || op === 'u-' || op === 'u+');
            while (ops.length) {
                const top = ops[ops.length - 1];
                if (top.t !== 'op') break;
                const tp = EXPR_PREC[top.v] || 0;
                if (right ? tp > prec : tp >= prec) out.push(ops.pop());
                else break;
            }
            ops.push({ t: 'op', v: op });
            prev = 'op';
        } else if (tok.t === '(') {
            ops.push(tok);
            prev = '(';
        } else if (tok.t === ')') {
            while (ops.length && ops[ops.length - 1].t !== '(') out.push(ops.pop());
            if (ops.length && ops[ops.length - 1].t === '(') ops.pop();
            if (ops.length && ops[ops.length - 1].t === 'fn') out.push(ops.pop());
            prev = 'val';
        }
    }
    while (ops.length) {
        const t = ops.pop();
        if (t.t !== '(') out.push(t);
    }
    return out;
}

function exprEvalRpn(rpn, params) {
    const st = [];
    for (let i = 0; i < rpn.length; i++) {
        const tok = rpn[i];
        if (tok.t === 'num') {
            st.push(tok.v);
        } else if (tok.t === 'id') {
            if (Object.prototype.hasOwnProperty.call(EXPR_CONSTS, tok.v)) {
                st.push(EXPR_CONSTS[tok.v]);
            } else if (params && Object.prototype.hasOwnProperty.call(params, tok.v)) {
                const p = params[tok.v];
                st.push(typeof p === 'number' ? p : Number(p) || 0);
            } else {
                st.push(0);
            }
        } else if (tok.t === 'fn') {
            const fn = EXPR_FUNCS[tok.v];
            if (!fn) { st.push(0); continue; }
            // Arity: si prende il minimo fra la lunghezza della funzione e lo stack.
            // clamp/lerp/pow/min/max hanno 2-3 args; abs/sin/... ne hanno 1.
            let n = fn.length;
            if (tok.v === 'min' || tok.v === 'max') n = Math.min(2, st.length);
            if (n > st.length) n = st.length;
            const args = st.splice(st.length - n, n);
            const r = fn.apply(null, args);
            st.push(typeof r === 'number' && isFinite(r) ? r : 0);
        } else if (tok.t === 'op') {
            if (tok.v === 'u-') {
                st.push(-(st.pop() || 0));
            } else if (tok.v === 'u+') {
                st.push(+(st.pop() || 0));
            } else {
                const b = st.pop() || 0;
                const a = st.pop() || 0;
                let r = 0;
                if (tok.v === '+') r = a + b;
                else if (tok.v === '-') r = a - b;
                else if (tok.v === '*') r = a * b;
                else if (tok.v === '/') r = b === 0 ? 0 : a / b;
                else if (tok.v === '%') r = b === 0 ? 0 : a % b;
                else if (tok.v === '^') r = Math.pow(a, b);
                st.push(isFinite(r) ? r : 0);
            }
        }
    }
    const r = st.length ? st[st.length - 1] : 0;
    return (typeof r === 'number' && isFinite(r)) ? r : 0;
}

const _exprCache = new Map();

function evalExpr(value, params) {
    if (typeof value === 'number') return isFinite(value) ? value : 0;
    if (typeof value === 'boolean') return value ? 1 : 0;
    if (value == null) return 0;
    const s = String(value).trim();
    if (!s) return 0;
    // Numero puro: non passa dal parser.
    const asNum = Number(s);
    if (s !== '' && isFinite(asNum) && /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(s)) {
        return asNum;
    }
    let rpn = _exprCache.get(s);
    if (!rpn) {
        rpn = exprToRpn(exprTokenize(s));
        if (_exprCache.size > 500) _exprCache.clear();
        _exprCache.set(s, rpn);
    }
    return exprEvalRpn(rpn, params || {});
}

function evalVec3(value, params, fallback) {
    fallback = fallback || [0, 0, 0];
    if (value == null) return fallback.slice();
    if (typeof value === 'number' || typeof value === 'string') {
        const s = evalExpr(value, params);
        return [s, s, s];
    }
    if (Array.isArray(value)) {
        return [
            evalExpr(value[0] != null ? value[0] : fallback[0], params),
            evalExpr(value[1] != null ? value[1] : fallback[1], params),
            evalExpr(value[2] != null ? value[2] : fallback[2], params),
        ];
    }
    if (typeof value === 'object') {
        return [
            evalExpr(value.x != null ? value.x : (value[0] != null ? value[0] : fallback[0]), params),
            evalExpr(value.y != null ? value.y : (value[1] != null ? value[1] : fallback[1]), params),
            evalExpr(value.z != null ? value.z : (value[2] != null ? value[2] : fallback[2]), params),
        ];
    }
    return fallback.slice();
}

// =======================================================================
//  02 - Mesh a array piatti (niente THREE)
//
//  Una mesh e' { pos:Float32Array|number[], idx:Uint32Array|number[],
//                mat?:string, name?:string }. Nessuna normale qui: si
//  calcolano al confine (quando si costruisce la BufferGeometry) oppure
//  per i validatori che ne hanno bisogno.
//
//  Tutte le trasformazioni mutano UNA copia: le primitive pure non si
//  toccano, cosi' un array di 20 istanze non deforma la sorgente.
// =======================================================================

function meshCreate(pos, idx, mat, name) {
    return {
        pos: (pos instanceof Float32Array) ? pos : new Float32Array(pos || []),
        idx: (idx instanceof Uint32Array) ? idx : new Uint32Array(idx || []),
        mat: mat || '',
        name: name || '',
    };
}

function meshClone(m) {
    return {
        pos: new Float32Array(m.pos),
        idx: new Uint32Array(m.idx),
        mat: m.mat || '',
        name: m.name || '',
    };
}

function meshVertCount(m) { return (m.pos.length / 3) | 0; }
function meshTriCount(m) { return (m.idx.length / 3) | 0; }

function meshIsEmpty(m) {
    return !m || m.pos.length < 9 || m.idx.length < 3;
}

function meshBounds(m) {
    const p = m.pos;
    if (!p.length) return { min: [0, 0, 0], max: [0, 0, 0], size: [0, 0, 0], center: [0, 0, 0] };
    let minX = p[0], minY = p[1], minZ = p[2];
    let maxX = p[0], maxY = p[1], maxZ = p[2];
    for (let i = 3; i < p.length; i += 3) {
        const x = p[i], y = p[i + 1], z = p[i + 2];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
    return {
        min: [minX, minY, minZ],
        max: [maxX, maxY, maxZ],
        size: [maxX - minX, maxY - minY, maxZ - minZ],
        center: [(minX + maxX) * 0.5, (minY + maxY) * 0.5, (minZ + maxZ) * 0.5],
    };
}

function meshTranslate(m, dx, dy, dz) {
    const p = m.pos;
    for (let i = 0; i < p.length; i += 3) {
        p[i] += dx; p[i + 1] += dy; p[i + 2] += dz;
    }
    return m;
}

function meshScale(m, sx, sy, sz) {
    if (sy == null) sy = sx;
    if (sz == null) sz = sx;
    const p = m.pos;
    for (let i = 0; i < p.length; i += 3) {
        p[i] *= sx; p[i + 1] *= sy; p[i + 2] *= sz;
    }
    return m;
}

/** Rotazione Euler XYZ in GRADI, intorno all'origine. */
function meshRotate(m, rx, ry, rz) {
    const toR = Math.PI / 180;
    const cx = Math.cos((rx || 0) * toR), sx = Math.sin((rx || 0) * toR);
    const cy = Math.cos((ry || 0) * toR), sy = Math.sin((ry || 0) * toR);
    const cz = Math.cos((rz || 0) * toR), sz = Math.sin((rz || 0) * toR);
    const p = m.pos;
    for (let i = 0; i < p.length; i += 3) {
        let x = p[i], y = p[i + 1], z = p[i + 2];
        // X
        let y2 = y * cx - z * sx;
        let z2 = y * sx + z * cx;
        y = y2; z = z2;
        // Y
        let x2 = x * cy + z * sy;
        z2 = -x * sy + z * cy;
        x = x2; z = z2;
        // Z
        x2 = x * cz - y * sz;
        y2 = x * sz + y * cz;
        p[i] = x2; p[i + 1] = y2; p[i + 2] = z;
    }
    return m;
}

function meshMirror(m, axis) {
    const p = m.pos;
    const a = (axis === 'y') ? 1 : (axis === 'z') ? 2 : 0;
    for (let i = 0; i < p.length; i += 3) p[i + a] = -p[i + a];
    // Specchiare inverte l'orientamento delle facce: si scambiano i due
    // indici di ogni triangolo, altrimenti le normali puntano dentro.
    const idx = m.idx;
    for (let i = 0; i < idx.length; i += 3) {
        const t = idx[i + 1];
        idx[i + 1] = idx[i + 2];
        idx[i + 2] = t;
    }
    return m;
}

function meshMerge(list) {
    let nV = 0, nI = 0;
    for (let i = 0; i < list.length; i++) {
        if (!list[i]) continue;
        nV += list[i].pos.length;
        nI += list[i].idx.length;
    }
    const pos = new Float32Array(nV);
    const idx = new Uint32Array(nI);
    let oV = 0, oI = 0, vBase = 0;
    let mat = '', name = '';
    for (let i = 0; i < list.length; i++) {
        const m = list[i];
        if (!m) continue;
        pos.set(m.pos, oV);
        const base = vBase;
        for (let j = 0; j < m.idx.length; j++) idx[oI + j] = m.idx[j] + base;
        oV += m.pos.length;
        oI += m.idx.length;
        vBase += (m.pos.length / 3) | 0;
        if (!mat && m.mat) mat = m.mat;
        if (!name && m.name) name = m.name;
    }
    return meshCreate(pos, idx, mat, name);
}

/** Normali per-vertice mediate. Ritorna Float32Array lungo come pos. */
function meshNormals(m) {
    const p = m.pos, idx = m.idx;
    const n = new Float32Array(p.length);
    for (let i = 0; i < idx.length; i += 3) {
        const ia = idx[i] * 3, ib = idx[i + 1] * 3, ic = idx[i + 2] * 3;
        const ax = p[ia], ay = p[ia + 1], az = p[ia + 2];
        const bx = p[ib], by = p[ib + 1], bz = p[ib + 2];
        const cx = p[ic], cy = p[ic + 1], cz = p[ic + 2];
        const abx = bx - ax, aby = by - ay, abz = bz - az;
        const acx = cx - ax, acy = cy - ay, acz = cz - az;
        const nx = aby * acz - abz * acy;
        const ny = abz * acx - abx * acz;
        const nz = abx * acy - aby * acx;
        n[ia] += nx; n[ia + 1] += ny; n[ia + 2] += nz;
        n[ib] += nx; n[ib + 1] += ny; n[ib + 2] += nz;
        n[ic] += nx; n[ic + 1] += ny; n[ic + 2] += nz;
    }
    for (let i = 0; i < n.length; i += 3) {
        const x = n[i], y = n[i + 1], z = n[i + 2];
        const l = Math.sqrt(x * x + y * y + z * z) || 1;
        n[i] = x / l; n[i + 1] = y / l; n[i + 2] = z / l;
    }
    return n;
}

/** Area totale delle facce (per i validatori e per scartare i degeneri). */
function meshArea(m) {
    const p = m.pos, idx = m.idx;
    let area = 0;
    for (let i = 0; i < idx.length; i += 3) {
        const ia = idx[i] * 3, ib = idx[i + 1] * 3, ic = idx[i + 2] * 3;
        const abx = p[ib] - p[ia], aby = p[ib + 1] - p[ia + 1], abz = p[ib + 2] - p[ia + 2];
        const acx = p[ic] - p[ia], acy = p[ic + 1] - p[ia + 1], acz = p[ic + 2] - p[ia + 2];
        const nx = aby * acz - abz * acy;
        const ny = abz * acx - abx * acz;
        const nz = abx * acy - aby * acx;
        area += 0.5 * Math.sqrt(nx * nx + ny * ny + nz * nz);
    }
    return area;
}

/** Volume firmato (teorema della divergenza). Positivo se le normali escono. */
function meshVolume(m) {
    const p = m.pos, idx = m.idx;
    let vol = 0;
    for (let i = 0; i < idx.length; i += 3) {
        const ia = idx[i] * 3, ib = idx[i + 1] * 3, ic = idx[i + 2] * 3;
        const ax = p[ia], ay = p[ia + 1], az = p[ia + 2];
        const bx = p[ib], by = p[ib + 1], bz = p[ib + 2];
        const cx = p[ic], cy = p[ic + 1], cz = p[ic + 2];
        vol += ax * (by * cz - bz * cy)
             - ay * (bx * cz - bz * cx)
             + az * (bx * cy - by * cx);
    }
    return vol / 6;
}

/** Quanti spigoli hanno un solo triangolo adiacente (0 = chiuso).

    Si saldano i vertici PER POSIZIONE, non per indice: box e sphere sono
    costruiti con vertici duplicati sui bordi di faccia (per le normali
    piatte / la cucitura UV), e contarli come distinti farebbe risultare
    aperto un guscio che geometricamente e' chiuso.
*/
function meshBoundaryEdges(m) {
    const p = m.pos, idx = m.idx;
    const quant = 1e4; // 0.1 mm
    function vid(i) {
        const o = i * 3;
        return (Math.round(p[o] * quant)) + ',' +
               (Math.round(p[o + 1] * quant)) + ',' +
               (Math.round(p[o + 2] * quant));
    }
    const edges = new Map();
    function key(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
    for (let i = 0; i < idx.length; i += 3) {
        const a = vid(idx[i]), b = vid(idx[i + 1]), c = vid(idx[i + 2]);
        if (a === b || b === c || c === a) continue; // degenere
        for (const k of [key(a, b), key(b, c), key(c, a)]) {
            edges.set(k, (edges.get(k) || 0) + 1);
        }
    }
    let boundary = 0;
    for (const n of edges.values()) if (n === 1) boundary++;
    return boundary;
}

function meshIsClosed(m) {
    return meshBoundaryEdges(m) === 0 && meshVertCount(m) >= 4;
}

// =======================================================================
//  03 - Primitive parametriche (niente THREE)
//
//  Ogni funzione ritorna {pos, idx}. Le dimensioni sono PIENE (non il
//  raggio) dove c'e' `s`, e il centro e' l'origine. `seg` decide quanti
//  spicchi hanno le forme tonde.
// =======================================================================

const DETAIL_LEVELS = [
    { seg: 8,  bevel: 1, nodes: 12 },
    { seg: 12, bevel: 1, nodes: 30 },
    { seg: 20, bevel: 2, nodes: 80 },
    { seg: 32, bevel: 3, nodes: 200 },
];

function primBox(sx, sy, sz) {
    const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
    // 24 vertici (4 per faccia) cosi' le normali per-faccia restano piatte.
    const pos = new Float32Array([
        // +Z
        -hx, -hy,  hz,  hx, -hy,  hz,  hx,  hy,  hz, -hx,  hy,  hz,
        // -Z
         hx, -hy, -hz, -hx, -hy, -hz, -hx,  hy, -hz,  hx,  hy, -hz,
        // +X
         hx, -hy,  hz,  hx, -hy, -hz,  hx,  hy, -hz,  hx,  hy,  hz,
        // -X
        -hx, -hy, -hz, -hx, -hy,  hz, -hx,  hy,  hz, -hx,  hy, -hz,
        // +Y
        -hx,  hy,  hz,  hx,  hy,  hz,  hx,  hy, -hz, -hx,  hy, -hz,
        // -Y
        -hx, -hy, -hz,  hx, -hy, -hz,  hx, -hy,  hz, -hx, -hy,  hz,
    ]);
    const idx = new Uint32Array([
        0,1,2, 0,2,3,  4,5,6, 4,6,7,  8,9,10, 8,10,11,
        12,13,14, 12,14,15,  16,17,18, 16,18,19,  20,21,22, 20,22,23,
    ]);
    return meshCreate(pos, idx);
}

function primPlane(sx, sz) {
    const hx = sx * 0.5, hz = sz * 0.5;
    return meshCreate(
        new Float32Array([-hx, 0, -hz,  hx, 0, -hz,  hx, 0,  hz, -hx, 0,  hz]),
        new Uint32Array([0, 1, 2, 0, 2, 3]));
}

function primSphere(r, seg) {
    seg = Math.max(6, seg | 0);
    const rings = Math.max(3, (seg / 2) | 0);
    const pos = [];
    const idx = [];
    for (let y = 0; y <= rings; y++) {
        const v = y / rings;
        const phi = v * Math.PI;
        const sp = Math.sin(phi), cp = Math.cos(phi);
        for (let x = 0; x <= seg; x++) {
            const u = x / seg;
            const th = u * Math.PI * 2;
            pos.push(r * sp * Math.cos(th), r * cp, r * sp * Math.sin(th));
        }
    }
    const stride = seg + 1;
    for (let y = 0; y < rings; y++) {
        for (let x = 0; x < seg; x++) {
            const a = y * stride + x;
            const b = a + stride;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
    }
    return meshCreate(pos, idx);
}

/** Cilindro lungo `axis` (default Y). `taper` e' il raggio in cima / raggio base. */
function primCyl(r, len, seg, taper, axis) {
    seg = Math.max(6, seg | 0);
    if (taper == null) taper = 1;
    const half = len * 0.5;
    const rTop = r * taper;
    const pos = [];
    const idx = [];
    // laterale: 2 anelli
    for (let i = 0; i <= seg; i++) {
        const a = (i / seg) * Math.PI * 2;
        const c = Math.cos(a), s = Math.sin(a);
        pos.push(r * c, -half, r * s);
        pos.push(rTop * c, half, rTop * s);
    }
    for (let i = 0; i < seg; i++) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        idx.push(a, c, b, b, c, d);
    }
    // coperchi (fan)
    if (r > 1e-6) {
        const baseCenter = (pos.length / 3) | 0;
        pos.push(0, -half, 0);
        const baseStart = (pos.length / 3) | 0;
        for (let i = 0; i < seg; i++) {
            const a = (i / seg) * Math.PI * 2;
            pos.push(r * Math.cos(a), -half, r * Math.sin(a));
        }
        for (let i = 0; i < seg; i++) {
            idx.push(baseCenter, baseStart + ((i + 1) % seg), baseStart + i);
        }
    }
    if (rTop > 1e-6) {
        const topCenter = (pos.length / 3) | 0;
        pos.push(0, half, 0);
        const topStart = (pos.length / 3) | 0;
        for (let i = 0; i < seg; i++) {
            const a = (i / seg) * Math.PI * 2;
            pos.push(rTop * Math.cos(a), half, rTop * Math.sin(a));
        }
        for (let i = 0; i < seg; i++) {
            idx.push(topCenter, topStart + i, topStart + ((i + 1) % seg));
        }
    }
    let m = meshCreate(pos, idx);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function primCaps(r, len, seg, axis) {
    // Capsula = cilindro + due emisfere. `len` e' la lunghezza TOTALE inclusi i cappucci.
    seg = Math.max(6, seg | 0);
    const body = Math.max(0, len - 2 * r);
    const parts = [];
    if (body > 1e-6) parts.push(primCyl(r, body, seg, 1, 'y'));
    // emisfera superiore
    const hemi = Math.max(3, (seg / 2) | 0);
    function hemiSphere(sign) {
        const pos = [], idx = [];
        for (let y = 0; y <= hemi; y++) {
            const v = y / hemi;
            const phi = v * Math.PI * 0.5;
            const sp = Math.sin(phi), cp = Math.cos(phi);
            for (let x = 0; x <= seg; x++) {
                const th = (x / seg) * Math.PI * 2;
                pos.push(r * sp * Math.cos(th),
                         sign * (body * 0.5 + r * cp),
                         r * sp * Math.sin(th));
            }
        }
        const stride = seg + 1;
        for (let y = 0; y < hemi; y++) {
            for (let x = 0; x < seg; x++) {
                const a = y * stride + x, b = a + stride;
                if (sign > 0) idx.push(a, a + 1, b, a + 1, b + 1, b);
                else idx.push(a, b, a + 1, a + 1, b, b + 1);
            }
        }
        return meshCreate(pos, idx);
    }
    parts.push(hemiSphere(1), hemiSphere(-1));
    let m = meshMerge(parts);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function primTorus(R, r, seg, arc) {
    seg = Math.max(6, seg | 0);
    const tube = Math.max(6, (seg / 2) | 0);
    if (arc == null) arc = 360;
    const arcR = (arc / 360) * Math.PI * 2;
    const closed = Math.abs(arc - 360) < 0.5;
    const segs = closed ? seg : Math.max(3, Math.ceil(seg * arc / 360));
    const pos = [];
    const idx = [];
    for (let i = 0; i <= segs; i++) {
        const u = (i / segs) * arcR;
        const cu = Math.cos(u), su = Math.sin(u);
        for (let j = 0; j <= tube; j++) {
            const v = (j / tube) * Math.PI * 2;
            const cv = Math.cos(v), sv = Math.sin(v);
            pos.push((R + r * cv) * cu, r * sv, (R + r * cv) * su);
        }
    }
    const stride = tube + 1;
    for (let i = 0; i < segs; i++) {
        for (let j = 0; j < tube; j++) {
            const a = i * stride + j, b = a + stride;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
    }
    return meshCreate(pos, idx);
}

function primWedge(sx, sy, sz) {
    // Cuneo: triangolo nel piano XY estruso su Z. Base a y=-hy, punta a +X.
    const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
    const pos = new Float32Array([
        -hx, -hy, -hz,  hx, -hy, -hz,  -hx,  hy, -hz,
        -hx, -hy,  hz,  hx, -hy,  hz,  -hx,  hy,  hz,
    ]);
    const idx = new Uint32Array([
        0, 2, 1,  3, 4, 5,          // front / back (winding)
        0, 1, 4,  0, 4, 3,          // bottom
        1, 2, 5,  1, 5, 4,          // slope
        0, 3, 5,  0, 5, 2,          // vertical
    ]);
    return meshCreate(pos, idx);
}

function primPyr(sx, sy, sz) {
    const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
    const pos = new Float32Array([
        -hx, -hy, -hz,  hx, -hy, -hz,  hx, -hy,  hz, -hx, -hy,  hz,  // base
         0,   hy,  0,                                              // apex
    ]);
    const idx = new Uint32Array([
        0, 1, 2, 0, 2, 3,          // base
        0, 4, 1, 1, 4, 2, 2, 4, 3, 3, 4, 0,
    ]);
    return meshCreate(pos, idx);
}

function primTube(r, len, wall, seg, axis) {
    wall = Math.max(0.001, Math.min(wall == null ? r * 0.3 : wall, r * 0.95));
    const outer = primCyl(r, len, seg, 1, axis);
    // Per un tubo vero servirebbe una booleana; qui si costruisce un guscio
    // a mano (anello laterale + due corone).
    seg = Math.max(6, seg | 0);
    const half = len * 0.5;
    const ri = r - wall;
    const pos = [];
    const idx = [];
    for (let i = 0; i <= seg; i++) {
        const a = (i / seg) * Math.PI * 2;
        const c = Math.cos(a), s = Math.sin(a);
        pos.push(r * c, -half, r * s);
        pos.push(r * c,  half, r * s);
        pos.push(ri * c, -half, ri * s);
        pos.push(ri * c,  half, ri * s);
    }
    for (let i = 0; i < seg; i++) {
        const o = i * 4;
        // outer wall
        idx.push(o, o + 4, o + 1, o + 1, o + 4, o + 5);
        // inner wall (inverted)
        idx.push(o + 2, o + 3, o + 6, o + 3, o + 7, o + 6);
        // bottom rim
        idx.push(o, o + 2, o + 4, o + 2, o + 6, o + 4);
        // top rim
        idx.push(o + 1, o + 5, o + 3, o + 3, o + 5, o + 7);
    }
    let m = meshCreate(pos, idx);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function _profilePoints(prof, sides, s) {
    // Ritorna lista di [x,y] nel piano del profilo. `s` e' la scala [sx,sy].
    const sx = (s && s[0]) || 1, sy = (s && s[1]) || sx;
    if (Array.isArray(prof)) {
        return prof.map(p => [p[0] * sx, p[1] * sy]);
    }
    const t = String(prof || 'rect').toLowerCase();
    const n = Math.max(3, sides | 0 || 6);
    const pts = [];
    if (t === 'rect' || t === 'rrect') {
        const hx = 0.5 * sx, hy = 0.5 * sy;
        if (t === 'rrect') {
            const rr = Math.min(hx, hy) * 0.2;
            const seg = 4;
            function corner(cx, cy, a0) {
                for (let i = 0; i <= seg; i++) {
                    const a = a0 + (i / seg) * Math.PI * 0.5;
                    pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
                }
            }
            corner(hx - rr, hy - rr, 0);
            corner(-hx + rr, hy - rr, Math.PI * 0.5);
            corner(-hx + rr, -hy + rr, Math.PI);
            corner(hx - rr, -hy + rr, Math.PI * 1.5);
        } else {
            pts.push([hx, hy], [-hx, hy], [-hx, -hy], [hx, -hy]);
        }
    } else if (t === 'ngon' || t === 'tri' || t === 'poly') {
        const nn = t === 'tri' ? 3 : n;
        for (let i = 0; i < nn; i++) {
            const a = (i / nn) * Math.PI * 2 + Math.PI / nn;
            pts.push([Math.cos(a) * 0.5 * sx, Math.sin(a) * 0.5 * sy]);
        }
    } else if (t === 'star') {
        for (let i = 0; i < n * 2; i++) {
            const a = (i / (n * 2)) * Math.PI * 2 - Math.PI * 0.5;
            const rad = (i % 2 === 0) ? 0.5 : 0.22;
            pts.push([Math.cos(a) * rad * sx, Math.sin(a) * rad * sy]);
        }
    } else if (t === 'l') {
        const t0 = 0.3;
        pts.push([0.5, 0.5], [-0.5, 0.5], [-0.5, -0.5], [0.5, -0.5],
                 [0.5, -0.5 + t0], [-0.5 + t0, -0.5 + t0],
                 [-0.5 + t0, 0.5 - t0], [0.5, 0.5 - t0]);
        for (const p of pts) { p[0] *= sx; p[1] *= sy; }
    } else if (t === 't' || t === 'cross') {
        const t0 = t === 'cross' ? 0.2 : 0.25;
        if (t === 'cross') {
            pts.push([t0, 0.5], [-t0, 0.5], [-t0, t0], [-0.5, t0], [-0.5, -t0],
                     [-t0, -t0], [-t0, -0.5], [t0, -0.5], [t0, -t0], [0.5, -t0],
                     [0.5, t0], [t0, t0]);
        } else {
            pts.push([0.5, 0.5], [-0.5, 0.5], [-0.5, 0.5 - t0], [-t0, 0.5 - t0],
                     [-t0, -0.5], [t0, -0.5], [t0, 0.5 - t0], [0.5, 0.5 - t0]);
        }
        for (const p of pts) { p[0] *= sx; p[1] *= sy; }
    } else if (t === 'trapz') {
        pts.push([0.5 * sx, -0.5 * sy], [0.3 * sx, 0.5 * sy],
                 [-0.3 * sx, 0.5 * sy], [-0.5 * sx, -0.5 * sy]);
    } else if (t === 'teardrop' || t === 'arc') {
        for (let i = 0; i <= n; i++) {
            const a = (i / n) * Math.PI * 2 - Math.PI * 0.5;
            const rr = (a > Math.PI * 0.5 && a < Math.PI * 1.5) ? 0.35 : 0.5;
            pts.push([Math.cos(a) * rr * sx, Math.sin(a) * rr * sy]);
        }
    } else {
        // fallback rect
        const hx = 0.5 * sx, hy = 0.5 * sy;
        pts.push([hx, hy], [-hx, hy], [-hx, -hy], [hx, -hy]);
    }
    return pts;
}

function primExtr(prof, len, sides, s, axis) {
    const pts = _profilePoints(prof, sides, s);
    if (pts.length < 3) return primBox(s ? s[0] : 1, len, s ? s[1] : 1);
    const half = len * 0.5;
    const n = pts.length;
    const pos = [];
    // anello basso + anello alto
    for (let i = 0; i < n; i++) pos.push(pts[i][0], -half, pts[i][1]);
    for (let i = 0; i < n; i++) pos.push(pts[i][0], half, pts[i][1]);
    const idx = [];
    for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const a = i, b = j, c = i + n, d = j + n;
        idx.push(a, b, c, b, d, c);
    }
    // coperchi: fan dal baricentro
    let cx = 0, cy = 0;
    for (const p of pts) { cx += p[0]; cy += p[1]; }
    cx /= n; cy /= n;
    const botC = (pos.length / 3) | 0;
    pos.push(cx, -half, cy);
    const topC = botC + 1;
    pos.push(cx, half, cy);
    for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        idx.push(botC, j, i);
        idx.push(topC, i + n, j + n);
    }
    let m = meshCreate(pos, idx);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function primLathe(prof, sides, arc, axis) {
    // `prof` e' una lista di [x,y] con x = raggio, y = altezza.
    let pts;
    if (Array.isArray(prof)) pts = prof;
    else pts = _profilePoints(prof, sides, [1, 1]).map(p => [Math.abs(p[0]), p[1]]);
    if (pts.length < 2) return primCyl(0.5, 1, sides, 1, axis);
    sides = Math.max(6, sides | 0 || 16);
    if (arc == null) arc = 360;
    const arcR = (arc / 360) * Math.PI * 2;
    const closed = Math.abs(arc - 360) < 0.5;
    const segs = closed ? sides : Math.max(3, Math.ceil(sides * arc / 360));
    const pos = [];
    const idx = [];
    for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * arcR;
        const c = Math.cos(a), s = Math.sin(a);
        for (let j = 0; j < pts.length; j++) {
            pos.push(pts[j][0] * c, pts[j][1], pts[j][0] * s);
        }
    }
    const stride = pts.length;
    for (let i = 0; i < segs; i++) {
        for (let j = 0; j < pts.length - 1; j++) {
            const a = i * stride + j, b = a + stride;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
    }
    let m = meshCreate(pos, idx);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function primLoft(secs, seg, axis) {
    // secs: [{at, s:[sx,sy,sz]}] ordinati. Si interpolano sezioni circolari/rettangolari.
    if (!secs || secs.length < 2) return primCyl(0.5, 1, seg, 1, axis);
    seg = Math.max(6, seg | 0);
    const sorted = secs.slice().sort((a, b) => a.at - b.at);
    const pos = [];
    const idx = [];
    for (let i = 0; i < sorted.length; i++) {
        const sc = sorted[i];
        const sx = (sc.s && sc.s[0]) || 1;
        const sy = (sc.s && sc.s[1]) || sx;
        // sezione ellittica nel piano XZ, Y = at
        for (let k = 0; k <= seg; k++) {
            const a = (k / seg) * Math.PI * 2;
            pos.push(Math.cos(a) * sx * 0.5, sc.at, Math.sin(a) * sy * 0.5);
        }
    }
    const stride = seg + 1;
    for (let i = 0; i < sorted.length - 1; i++) {
        for (let k = 0; k < seg; k++) {
            const a = i * stride + k, b = a + stride;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
    }
    // coperchi
    function cap(si, flip) {
        const base = si * stride;
        const cIdx = (pos.length / 3) | 0;
        let cx = 0, cy = 0, cz = 0;
        for (let k = 0; k < seg; k++) {
            cx += pos[(base + k) * 3];
            cy += pos[(base + k) * 3 + 1];
            cz += pos[(base + k) * 3 + 2];
        }
        pos.push(cx / seg, cy / seg, cz / seg);
        for (let k = 0; k < seg; k++) {
            if (flip) idx.push(cIdx, base + k, base + ((k + 1) % seg));
            else idx.push(cIdx, base + ((k + 1) % seg), base + k);
        }
    }
    cap(0, true);
    cap(sorted.length - 1, false);
    let m = meshCreate(pos, idx);
    // Centra su Y (at e' assoluto nella spec, ma la primitiva e' centrata)
    const b = meshBounds(m);
    meshTranslate(m, 0, -b.center[1], 0);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function primHelix(r, r2, len, turns, seg, axis) {
    turns = Math.max(0.5, turns || 3);
    r2 = r2 == null ? r * 0.15 : r2;
    seg = Math.max(8, seg | 0);
    const steps = Math.max(8, Math.ceil(seg * turns * 2));
    const tubeSeg = Math.max(4, (seg / 3) | 0);
    const pos = [];
    const idx = [];
    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = t * turns * Math.PI * 2;
        const y = (t - 0.5) * len;
        const cx = Math.cos(a) * r, cz = Math.sin(a) * r;
        // tangente approssimata
        const tx = -Math.sin(a), tz = Math.cos(a);
        // normale (verso l'asse) e binormale
        const nx = -Math.cos(a), nz = -Math.sin(a);
        for (let j = 0; j <= tubeSeg; j++) {
            const b = (j / tubeSeg) * Math.PI * 2;
            const cb = Math.cos(b), sb = Math.sin(b);
            // cerchio nel piano (n, up-ish)
            pos.push(cx + (nx * cb + 0 * sb) * r2,
                     y + sb * r2,
                     cz + (nz * cb) * r2);
        }
    }
    const stride = tubeSeg + 1;
    for (let i = 0; i < steps; i++) {
        for (let j = 0; j < tubeSeg; j++) {
            const a = i * stride + j, b = a + stride;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
    }
    let m = meshCreate(pos, idx);
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

function primField(sx, sy, sz, seed, amp, freq, seg) {
    // Heightfield su XZ, altezza Y da rumore value-noise semplice.
    seg = Math.max(4, seg | 0);
    seed = seed || 0;
    amp = amp == null ? 0.3 : amp;
    freq = freq == null ? 2 : freq;
    function hash(ix, iz) {
        let n = (ix * 374761393 + iz * 668265263 + seed * 1274126177) | 0;
        n = (n ^ (n >> 13)) * 1274126177;
        n = n ^ (n >> 16);
        return ((n & 0x7fffffff) / 0x7fffffff) * 2 - 1;
    }
    function smooth(ix, iz) {
        const x0 = Math.floor(ix), z0 = Math.floor(iz);
        const fx = ix - x0, fz = iz - z0;
        const sx_ = fx * fx * (3 - 2 * fx), sz_ = fz * fz * (3 - 2 * fz);
        const a = hash(x0, z0), b = hash(x0 + 1, z0);
        const c = hash(x0, z0 + 1), d = hash(x0 + 1, z0 + 1);
        return a + (b - a) * sx_ + (c - a) * sz_ + (a - b - c + d) * sx_ * sz_;
    }
    const pos = [];
    const idx = [];
    for (let z = 0; z <= seg; z++) {
        for (let x = 0; x <= seg; x++) {
            const u = x / seg, v = z / seg;
            const px = (u - 0.5) * sx;
            const pz = (v - 0.5) * sz;
            const h = smooth(u * freq, v * freq) * amp * sy;
            pos.push(px, h, pz);
        }
    }
    const stride = seg + 1;
    for (let z = 0; z < seg; z++) {
        for (let x = 0; x < seg; x++) {
            const a = z * stride + x, b = a + stride;
            idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
    }
    // Spessore minimo: estrude verso il basso per avere un volume chiuso.
    const topN = (pos.length / 3) | 0;
    const baseY = -sy * 0.5;
    for (let z = 0; z <= seg; z++) {
        for (let x = 0; x <= seg; x++) {
            const u = x / seg, v = z / seg;
            pos.push((u - 0.5) * sx, baseY, (v - 0.5) * sz);
        }
    }
    for (let z = 0; z < seg; z++) {
        for (let x = 0; x < seg; x++) {
            const a = topN + z * stride + x, b = a + stride;
            idx.push(a, a + 1, b, a + 1, b + 1, b);
        }
    }
    // lati
    function edge(getTop, getBot, n) {
        for (let i = 0; i < n; i++) {
            const t0 = getTop(i), t1 = getTop(i + 1);
            const b0 = getBot(i), b1 = getBot(i + 1);
            idx.push(t0, b0, t1, t1, b0, b1);
        }
    }
    edge(i => i, i => topN + i, seg);
    edge(i => seg * stride + i, i => topN + seg * stride + i, seg);
    edge(i => i * stride, i => topN + i * stride, seg);
    edge(i => i * stride + seg, i => topN + i * stride + seg, seg);
    return meshCreate(pos, idx);
}

function primStairs(sx, sy, sz, steps) {
    steps = Math.max(1, Math.min(64, steps | 0 || 6));
    const parts = [];
    const stepH = sy / steps;
    const stepD = sz / steps;
    for (let i = 0; i < steps; i++) {
        const d = sz - i * stepD;
        const box = primBox(sx, stepH, d);
        meshTranslate(box, 0, -sy * 0.5 + stepH * (i + 0.5), -sz * 0.5 + d * 0.5);
        parts.push(box);
    }
    return meshMerge(parts);
}

function primArch(sx, sy, sz, r, wall, seg) {
    // Arco: blocco con un buco a semicerchio. Approssimato come estrusione
    // di un profilo a U rovesciata.
    wall = wall == null ? Math.min(sx, sy) * 0.15 : wall;
    r = r == null ? Math.min(sx * 0.5 - wall, sy - wall) : r;
    seg = Math.max(6, seg | 0);
    const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
    const pts = [];
    // profilo esterno (rettangolo)
    // e interno (semicerchio + piedi)
    // Costruiamo due box laterali + un box sopra + un torus mezzo... piu'
    // semplice: box pieno e si lascia al CSG il buco. Qui, senza CSG ancora
    // caricato, costruiamo un guscio a U.
    const parts = [];
    // piedritto sx
    const post = primBox(wall, sy, sz);
    meshTranslate(meshClone(post), -hx + wall * 0.5, 0, 0);
    parts.push(meshTranslate(primBox(wall, sy, sz), -hx + wall * 0.5, 0, 0));
    parts.push(meshTranslate(primBox(wall, sy, sz), hx - wall * 0.5, 0, 0));
    // architrave
    const topH = Math.max(wall, sy - r - 0.01);
    parts.push(meshTranslate(primBox(sx, topH, sz), 0, hy - topH * 0.5, 0));
    // semicerchio pieno come "spalla" dell'arco (semplificato: torus mezzo no;
    // due wedge / un cyl tagliato). Usiamo un mezzo-cilindro come rinfianco.
    const arch = primCyl(r + wall, sz, seg, 1, 'z');
    // non sottraiamo: lasciamo il mezzo-cilindro sopra i piedritti come arco pieno
    // (l'apertura e' lo spazio sotto). Per un arco vero il buco andrebbe scavato
    // col CSG; qui e' un arco "pieno" stilizzato.
    meshTranslate(arch, 0, -hy + r + wall * 0.5, 0);
    // taglia la meta' inferiore nascondendola: teniamo solo y > centro
    // (filtro vertici e' costoso; lasciamo l'arco pieno e i piedritti).
    parts.push(arch);
    return meshMerge(parts);
}

/** Costruisce la primitiva di un nodo gia' risolto (numeri puri). */
function primBuild(node, seg, bevelSeg) {
    const p = node.p || 'box';
    const s = node.s || [1, 1, 1];
    const axis = node.axis || 'y';
    seg = seg || 16;
    bevelSeg = bevelSeg || 2;
    switch (p) {
        case 'box':
            // `bevel` non e' piu' decorativo: se c'e', si costruisce una
            // scatola RACCORDATA. Era il campo piu' usato dal generatore e
            // veniva ignorato in silenzio.
            if (node.bevel && node.bevel > 1e-6) {
                return primRoundBox(s[0], s[1], s[2], node.bevel, bevelSeg);
            }
            return primBox(s[0], s[1], s[2]);
        case 'plane':  return primPlane(s[0], s[2] != null ? s[2] : s[1]);
        case 'sphere': {
            const r = node.r != null ? node.r : Math.max(s[0], s[1], s[2]) * 0.5;
            const m = primSphere(r, seg);
            if (node.r == null && (s[0] !== s[1] || s[1] !== s[2])) {
                meshScale(m, s[0] / (r * 2), s[1] / (r * 2), s[2] / (r * 2));
            }
            return m;
        }
        case 'cyl':    return primCyl(node.r != null ? node.r : s[0] * 0.5,
                                      node.len != null ? node.len : s[1],
                                      seg, node.taper, axis);
        case 'caps':   return primCaps(node.r != null ? node.r : s[0] * 0.5,
                                       node.len != null ? node.len : s[1],
                                       seg, axis);
        case 'torus':  return primTorus(node.r != null ? node.r : s[0] * 0.5,
                                        node.r2 != null ? node.r2 : (node.r || s[0] * 0.5) * 0.3,
                                        seg, node.arc);
        case 'wedge':  return primWedge(s[0], s[1], s[2]);
        case 'pyr':    return primPyr(s[0], s[1], s[2]);
        case 'tube':   return primTube(node.r != null ? node.r : s[0] * 0.5,
                                       node.len != null ? node.len : s[1],
                                       node.wall, seg, axis);
        case 'extr':   return primExtr(node.prof || 'rect',
                                       node.len != null ? node.len : s[1],
                                       node.sides || seg,
                                       s, axis);
        case 'lathe':  return primLathe(node.prof, node.sides || seg, node.arc, axis);
        case 'loft':   return primLoft2(node.secs, node.shape || 'ellipse', seg, axis,
                                        node.closed !== false);
        case 'helix':  return primHelix(node.r || 0.4, node.r2, node.len || 1,
                                        node.turns || 4, seg, axis);
        case 'field':  return primField(s[0], s[1], s[2], node.seed, node.amp,
                                        node.freq, Math.max(6, (seg / 2) | 0));
        case 'stairs': return primStairs(s[0], s[1], s[2], node.steps || 6);
        case 'arch':   return primArch(s[0], s[1], s[2], node.r, node.wall, seg);
        default:       return primBox(s[0], s[1], s[2]);
    }
}

// =======================================================================
//  03b - Deformatori (niente THREE, array piatti)
//
//  Perche' esistono: un motore che sa solo PIAZZARE volumi produce oggetti
//  fatti di mattoni. Una lama si assottiglia verso la punta e verso il
//  filo, un manico si stringe in mezzo, un tetto e' inclinato, una roccia
//  e' irregolare. Sono tutte deformazioni di una primitiva, non primitive
//  nuove: aggiungerne una al catalogo per ogni forma sarebbe un catalogo
//  infinito.
//
//  Tutti operano in SPAZIO LOCALE (primitiva centrata sull'origine) e
//  PRIMA di rotazione e traslazione: deformare dopo aver ruotato darebbe
//  una rastremazione obliqua rispetto al pezzo.
// =======================================================================

const AXIS_I = { x: 0, y: 1, z: 2 };

function axisIndex(axis) {
    const i = AXIS_I[String(axis || 'y').toLowerCase()[0]];
    return i === undefined ? 1 : i;
}

/** Estensione [min,max] della mesh lungo un asse. */
function meshExtent(m, ai) {
    const p = m.pos;
    if (!p.length) return [0, 0];
    let lo = p[ai], hi = p[ai];
    for (let i = ai; i < p.length; i += 3) {
        if (p[i] < lo) lo = p[i];
        if (p[i] > hi) hi = p[i];
    }
    return [lo, hi];
}

/** Fattore normalizzato 0..1 lungo l'asse (0 = estremo min, 1 = estremo max). */
function _tFactor(v, lo, hi) {
    const span = hi - lo;
    if (Math.abs(span) < 1e-9) return 0.5;
    const t = (v - lo) / span;
    return t < 0 ? 0 : (t > 1 ? 1 : t);
}

/**
 * Rastremazione: scala la SEZIONE trasversale lungo l'asse.
 * `s0` e `s1` sono i fattori di scala all'estremo MIN e MAX, ognuno
 * `{a, b}` sui due assi trasversali (a = primo asse in ordine XYZ).
 * E' il deformatore che fa una lama, un tronco, una gamba di un tavolo.
 */
function meshTaper(m, axis, s0, s1) {
    const ai = axisIndex(axis);
    const [lo, hi] = meshExtent(m, ai);
    const cross = [0, 1, 2].filter(i => i !== ai);
    const p = m.pos;
    const a0 = (s0 && s0.a != null) ? s0.a : 1;
    const b0 = (s0 && s0.b != null) ? s0.b : 1;
    const a1 = (s1 && s1.a != null) ? s1.a : 1;
    const b1 = (s1 && s1.b != null) ? s1.b : 1;
    for (let i = 0; i < p.length; i += 3) {
        const t = _tFactor(p[i + ai], lo, hi);
        const sa = a0 + (a1 - a0) * t;
        const sb = b0 + (b1 - b0) * t;
        p[i + cross[0]] *= sa;
        p[i + cross[1]] *= sb;
    }
    return m;
}

/**
 * Inclinazione: sposta la sezione progressivamente lungo `by`.
 * `amount` e' lo spostamento TOTALE fra i due estremi, in unita' di mondo.
 * Serve per tetti, rampe, lame a sciabola, appoggi obliqui.
 */
function meshShear(m, axis, by, amount) {
    const ai = axisIndex(axis);
    const bi = axisIndex(by);
    if (ai === bi) return m;
    const [lo, hi] = meshExtent(m, ai);
    const p = m.pos;
    for (let i = 0; i < p.length; i += 3) {
        const t = _tFactor(p[i + ai], lo, hi) - 0.5;
        p[i + bi] += amount * t;
    }
    return m;
}

/** Torsione: rotazione progressiva attorno all'asse. `deg` e' l'angolo TOTALE. */
function meshTwist(m, axis, deg) {
    const ai = axisIndex(axis);
    const [lo, hi] = meshExtent(m, ai);
    const cross = [0, 1, 2].filter(i => i !== ai);
    const p = m.pos;
    const rad = (deg || 0) * Math.PI / 180;
    for (let i = 0; i < p.length; i += 3) {
        const t = _tFactor(p[i + ai], lo, hi) - 0.5;
        const a = rad * t;
        const c = Math.cos(a), s = Math.sin(a);
        const u = p[i + cross[0]], v = p[i + cross[1]];
        p[i + cross[0]] = u * c - v * s;
        p[i + cross[1]] = u * s + v * c;
    }
    return m;
}

/**
 * Piega: curva la mesh lungo l'asse, nel piano (asse, verso).
 * `deg` e' l'angolo TOTALE della curvatura. Corni, sciabole, archi, tubi
 * piegati, code.
 */
function meshBend(m, axis, deg, towards) {
    const ai = axisIndex(axis);
    const bi = axisIndex(towards || (ai === 1 ? 'z' : 'y'));
    if (ai === bi) return m;
    const rad = (deg || 0) * Math.PI / 180;
    if (Math.abs(rad) < 1e-6) return m;
    const [lo, hi] = meshExtent(m, ai);
    const len = hi - lo;
    if (len < 1e-9) return m;
    // Raggio tale che l'arco lungo `len` copra `rad`.
    const R = len / rad;
    const p = m.pos;
    for (let i = 0; i < p.length; i += 3) {
        const s = p[i + ai] - (lo + hi) * 0.5;    // arco dal centro
        const off = p[i + bi];                     // distanza dall'asse neutro
        const a = s / R;
        const r = R - off;
        p[i + ai] = Math.sin(a) * r;
        p[i + bi] = R - Math.cos(a) * r;
    }
    return m;
}

/**
 * Irregolarita' superficiale: sposta i vertici lungo la normale con
 * value-noise. Rocce, terreno, corteccia, metallo martellato.
 * `amp` e' in unita' di mondo.
 */
function meshWarp(m, amp, freq, seed) {
    amp = amp || 0;
    if (Math.abs(amp) < 1e-9) return m;
    freq = freq || 4;
    seed = (seed || 0) * 0.137;
    const n = meshNormals(m);
    const p = m.pos;
    function hash(x, y, z) {
        let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + seed) * 43758.5453;
        return (h - Math.floor(h)) * 2 - 1;
    }
    function noise(x, y, z) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        const xf = x - xi, yf = y - yi, zf = z - zi;
        const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf), sz = zf * zf * (3 - 2 * zf);
        let acc = 0;
        for (let dz = 0; dz < 2; dz++) {
            for (let dy = 0; dy < 2; dy++) {
                for (let dx = 0; dx < 2; dx++) {
                    const w = (dx ? sx : 1 - sx) * (dy ? sy : 1 - sy) * (dz ? sz : 1 - sz);
                    acc += w * hash(xi + dx, yi + dy, zi + dz);
                }
            }
        }
        return acc;
    }
    for (let i = 0; i < p.length; i += 3) {
        const d = noise(p[i] * freq, p[i + 1] * freq, p[i + 2] * freq) * amp;
        p[i] += n[i] * d;
        p[i + 1] += n[i + 1] * d;
        p[i + 2] += n[i + 2] * d;
    }
    return m;
}

/**
 * Schiacciamento asimmetrico su UN lato: comprime solo la meta' positiva o
 * negativa di un asse. E' il "stringere solo da un lato" — un filo di lama,
 * uno scalino a sbalzo, un profilo a goccia.
 */
function meshSquash(m, axis, side, factor) {
    const ai = axisIndex(axis);
    const p = m.pos;
    const f = factor == null ? 0.5 : factor;
    const positive = String(side || 'max') !== 'min';
    for (let i = 0; i < p.length; i += 3) {
        const v = p[i + ai];
        if (positive ? v > 0 : v < 0) p[i + ai] = v * f;
    }
    return m;
}

/**
 * Scatola con RACCORDO vero (rounded box).
 *
 * Si costruisce una griglia su ogni faccia e si proietta ogni vertice sulla
 * superficie della scatola arrotondata: preso il punto piu' vicino sulla
 * scatola INTERNA (quella ristretta di `r`), il vertice finisce a distanza
 * `r` da quello. E' la definizione della rounded box, e per costruzione i
 * vertici condivisi da due facce cadono nello stesso punto — quindi il
 * guscio resta chiuso senza cuciture da saldare a mano.
 *
 * Un bevel e' cio' che distingue un oggetto costruito da un cubo grezzo, e
 * fino a ieri il campo `bevel` della spec veniva ACCETTATO E IGNORATO.
 */
function primRoundBox(sx, sy, sz, r, seg) {
    const hx = sx * 0.5, hy = sy * 0.5, hz = sz * 0.5;
    const maxR = Math.min(hx, hy, hz) * 0.98;
    r = Math.max(0, Math.min(r || 0, maxR));
    if (r < 1e-6) return primBox(sx, sy, sz);
    seg = Math.max(1, Math.min(8, seg | 0 || 2));
    const ix = hx - r, iy = hy - r, iz = hz - r;

    const pos = [];
    const idx = [];
    const n = seg + 1;

    // Sei facce, ognuna una griglia (n+1)x(n+1) sul quadrato della faccia.
    const faces = [
        { o: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] },   // +Z
        { o: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0] },  // -Z
        { o: [1, 0, 0], u: [0, 0, -1], v: [0, 1, 0] },   // +X
        { o: [-1, 0, 0], u: [0, 0, 1], v: [0, 1, 0] },   // -X
        { o: [0, 1, 0], u: [1, 0, 0], v: [0, 0, -1] },   // +Y
        { o: [0, -1, 0], u: [1, 0, 0], v: [0, 0, 1] },   // -Y
    ];

    function project(x, y, z) {
        // punto piu' vicino sulla scatola interna
        const cx = Math.max(-ix, Math.min(ix, x));
        const cy = Math.max(-iy, Math.min(iy, y));
        const cz = Math.max(-iz, Math.min(iz, z));
        let dx = x - cx, dy = y - cy, dz = z - cz;
        const l = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (l < 1e-9) return [x, y, z];
        return [cx + dx / l * r, cy + dy / l * r, cz + dz / l * r];
    }

    for (const f of faces) {
        const base = (pos.length / 3) | 0;
        for (let j = 0; j <= n; j++) {
            const fv = (j / n) * 2 - 1;
            for (let i2 = 0; i2 <= n; i2++) {
                const fu = (i2 / n) * 2 - 1;
                const x = f.o[0] * hx + f.u[0] * fu * hx + f.v[0] * fv * hx;
                const y = f.o[1] * hy + f.u[1] * fu * hy + f.v[1] * fv * hy;
                const z = f.o[2] * hz + f.u[2] * fu * hz + f.v[2] * fv * hz;
                // Le componenti lungo l'asse della faccia restano al bordo.
                const px = f.o[0] !== 0 ? f.o[0] * hx : x;
                const py = f.o[1] !== 0 ? f.o[1] * hy : y;
                const pz = f.o[2] !== 0 ? f.o[2] * hz : z;
                const q = project(px, py, pz);
                pos.push(q[0], q[1], q[2]);
            }
        }
        const stride = n + 1;
        for (let j = 0; j < n; j++) {
            for (let i2 = 0; i2 < n; i2++) {
                const a = base + j * stride + i2;
                const b = a + 1;
                const c = a + stride;
                const d = c + 1;
                idx.push(a, b, c, b, d, c);
            }
        }
    }
    return meshCreate(pos, idx);
}

/** Sezione 2D per il loft: rettangolo, ellisse, lente (lama), esagono. */
function sectionPoints(shape, seg) {
    const s = String(shape || 'ellipse').toLowerCase();
    seg = Math.max(4, seg | 0 || 12);
    const pts = [];
    if (s === 'rect' || s === 'box') {
        // Rettangolo con densita' uniforme sul perimetro (4 lati x k punti).
        const k = Math.max(1, Math.round(seg / 4));
        const corners = [[0.5, 0.5], [-0.5, 0.5], [-0.5, -0.5], [0.5, -0.5]];
        for (let c = 0; c < 4; c++) {
            const a = corners[c], b = corners[(c + 1) % 4];
            for (let i = 0; i < k; i++) {
                const t = i / k;
                pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
            }
        }
    } else if (s === 'lens' || s === 'blade' || s === 'lente') {
        // Lente biconvessa: e' la sezione di una LAMA. Due archi che si
        // incontrano in due punte laterali: e' cio' che da' il filo.
        const k = Math.max(3, Math.round(seg / 2));
        for (let i = 0; i <= k; i++) {
            const t = (i / k) * 2 - 1;
            pts.push([t * 0.5, Math.cos(t * Math.PI / 2) * 0.5]);
        }
        for (let i = k - 1; i > 0; i--) {
            const t = (i / k) * 2 - 1;
            pts.push([t * 0.5, -Math.cos(t * Math.PI / 2) * 0.5]);
        }
    } else if (s === 'hex' || s === 'hexagon') {
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
            pts.push([Math.cos(a) * 0.5, Math.sin(a) * 0.5]);
        }
    } else if (s === 'tri') {
        for (let i = 0; i < 3; i++) {
            const a = (i / 3) * Math.PI * 2 + Math.PI / 2;
            pts.push([Math.cos(a) * 0.5, Math.sin(a) * 0.5]);
        }
    } else {
        for (let i = 0; i < seg; i++) {
            const a = (i / seg) * Math.PI * 2;
            pts.push([Math.cos(a) * 0.5, Math.sin(a) * 0.5]);
        }
    }
    return pts;
}

/**
 * Loft con sezione a scelta e scala per-sezione su DUE assi.
 * Sostituisce il vecchio loft sempre-ellittico: una carrozzeria, un fusto,
 * una lama non sono cilindri schiacciati.
 */
function primLoft2(secs, shape, seg, axis, closedEnds) {
    if (!secs || secs.length < 2) return primCyl(0.5, 1, seg, 1, axis);
    const sorted = secs.slice().sort((a, b) => a.at - b.at);
    const ring = sectionPoints(shape, seg);
    const rn = ring.length;
    const pos = [];
    const idx = [];
    for (let i = 0; i < sorted.length; i++) {
        const sc = sorted[i];
        const sa = (sc.s && sc.s[0] != null) ? sc.s[0] : 1;
        const sb = (sc.s && sc.s[1] != null) ? sc.s[1] : sa;
        for (let k = 0; k < rn; k++) {
            pos.push(ring[k][0] * sa, sc.at, ring[k][1] * sb);
        }
    }
    for (let i = 0; i < sorted.length - 1; i++) {
        for (let k = 0; k < rn; k++) {
            const k2 = (k + 1) % rn;
            const a = i * rn + k, b = i * rn + k2;
            const c = (i + 1) * rn + k, d = (i + 1) * rn + k2;
            idx.push(a, c, b, b, c, d);
        }
    }
    if (closedEnds !== false) {
        for (const [si, flip] of [[0, true], [sorted.length - 1, false]]) {
            const base = si * rn;
            const ci = (pos.length / 3) | 0;
            let cx = 0, cy = 0, cz = 0;
            for (let k = 0; k < rn; k++) {
                cx += pos[(base + k) * 3];
                cy += pos[(base + k) * 3 + 1];
                cz += pos[(base + k) * 3 + 2];
            }
            pos.push(cx / rn, cy / rn, cz / rn);
            for (let k = 0; k < rn; k++) {
                const k2 = (k + 1) % rn;
                if (flip) idx.push(ci, base + k, base + k2);
                else idx.push(ci, base + k2, base + k);
            }
        }
    }
    let m = meshCreate(pos, idx);
    // NON si ricentra: in un loft le `secs.at` sono coordinate ASSOLUTE
    // sull'asse, cosi' il costruttore le prende dal piano (`lama_a`, `lama_b`)
    // e non deve calcolare un centro. Ricentrare qui renderebbe falsa quella
    // promessa e sposterebbe ogni loft di mezza lunghezza.
    if (axis === 'x') meshRotate(m, 0, 0, -90);
    else if (axis === 'z') meshRotate(m, 90, 0, 0);
    return m;
}

/** Normalizza il campo `taper`/`taper0` in `{a, b}`. */
function _taperPair(v, fallback) {
    if (v == null) return null;
    if (typeof v === 'number') return { a: v, b: v };
    if (typeof v === 'object') {
        const a = (v.a != null) ? v.a : (v.x != null ? v.x : (v.w != null ? v.w : 1));
        const b = (v.b != null) ? v.b : (v.z != null ? v.z : (v.d != null ? v.d : a));
        return { a: a, b: b };
    }
    return fallback || null;
}

/**
 * Applica tutti i deformatori dichiarati su un nodo GIA' risolto.
 * L'ordine e' fisso e non e' arbitrario: rastremare dopo aver piegato
 * darebbe una sezione che varia lungo una curva invece che lungo il pezzo.
 */
function applyDeformers(m, node) {
    const axis = node.axis || 'y';
    // 1. rastremazione (sezione lungo l'asse)
    const t1 = _taperPair(node.taperTo != null ? node.taperTo : node.taperObj);
    const t0 = _taperPair(node.taper0);
    if (t0 || t1) {
        meshTaper(m, axis, t0 || { a: 1, b: 1 }, t1 || { a: 1, b: 1 });
    }
    // 2. schiacciamento asimmetrico
    if (node.squash) {
        meshSquash(m, node.squash.axis || 'z', node.squash.side,
                   node.squash.f != null ? node.squash.f : 0.5);
    }
    // 3. inclinazione
    if (node.shear && node.shear.by != null) {
        meshShear(m, axis, node.shear.by, node.shear.amount || 0);
    }
    // 4. torsione
    if (node.twist) meshTwist(m, axis, node.twist);
    // 5. piega
    if (node.bendA) meshBend(m, axis, node.bendA, node.bendTo);
    // 6. irregolarita'
    if (node.warp && node.warp.amp) {
        meshWarp(m, node.warp.amp, node.warp.freq, node.warp.seed);
    }
    return m;
}

// =======================================================================
//  04 - CSG su array piatti (BSP alla csg.js)
//
//  Unione / sottrazione / intersezione senza dipendenze. Dopo ogni op si
//  verifica che il guscio resti chiuso: se non lo e', si tiene la mesh non
//  tagliata e si emette un avviso — esportare un modello bucato e' peggio
//  di perdere un dettaglio.
// =======================================================================

function csgEps() { return 1e-5; }

function csgV(x, y, z) { return { x: x, y: y, z: z }; }
function csgCloneV(v) { return { x: v.x, y: v.y, z: v.z }; }
function csgAdd(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
function csgSub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function csgMul(a, s) { return { x: a.x * s, y: a.y * s, z: a.z * s }; }
function csgDot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function csgCross(a, b) {
    return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
}
function csgLerp(a, b, t) {
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t };
}

function csgPoly(vertices) {
    const a = vertices[0], b = vertices[1], c = vertices[2];
    const n = csgCross(csgSub(b, a), csgSub(c, a));
    const len = Math.sqrt(n.x * n.x + n.y * n.y + n.z * n.z) || 1;
    n.x /= len; n.y /= len; n.z /= len;
    return { vertices: vertices.map(csgCloneV), normal: n, w: csgDot(n, a) };
}

function csgFlip(poly) {
    poly.vertices.reverse();
    poly.normal = csgMul(poly.normal, -1);
    poly.w = -poly.w;
    return poly;
}

function csgClonePoly(poly) {
    return {
        vertices: poly.vertices.map(csgCloneV),
        normal: csgCloneV(poly.normal),
        w: poly.w,
    };
}

// Classifica e spezza un poligono rispetto a un piano.
const CSG_COPLANAR = 0, CSG_FRONT = 1, CSG_BACK = 2, CSG_SPANNING = 3;

function csgSplitPoly(plane, poly, coFront, coBack, front, back) {
    const EPS = csgEps();
    let polyType = 0;
    const types = [];
    for (let i = 0; i < poly.vertices.length; i++) {
        const t = csgDot(plane.normal, poly.vertices[i]) - plane.w;
        const type = t < -EPS ? CSG_BACK : t > EPS ? CSG_FRONT : CSG_COPLANAR;
        polyType |= type;
        types.push(type);
    }
    switch (polyType) {
        case CSG_COPLANAR:
            (csgDot(plane.normal, poly.normal) > 0 ? coFront : coBack).push(poly);
            break;
        case CSG_FRONT: front.push(poly); break;
        case CSG_BACK: back.push(poly); break;
        case CSG_SPANNING: {
            const f = [], b = [];
            for (let i = 0; i < poly.vertices.length; i++) {
                const j = (i + 1) % poly.vertices.length;
                const ti = types[i], tj = types[j];
                const vi = poly.vertices[i], vj = poly.vertices[j];
                if (ti !== CSG_BACK) f.push(vi);
                if (ti !== CSG_FRONT) b.push(ti !== CSG_BACK ? csgCloneV(vi) : vi);
                if ((ti | tj) === CSG_SPANNING) {
                    const t = (plane.w - csgDot(plane.normal, vi))
                            / csgDot(plane.normal, csgSub(vj, vi));
                    const v = csgLerp(vi, vj, t);
                    f.push(v);
                    b.push(csgCloneV(v));
                }
            }
            if (f.length >= 3) front.push(csgPoly(f));
            if (b.length >= 3) back.push(csgPoly(b));
            break;
        }
    }
}

function csgNode(polys) {
    return { plane: null, front: null, back: null, polygons: polys || [] };
}

function csgBuild(node, polys) {
    if (!polys || !polys.length) return;
    if (!node.plane) node.plane = {
        normal: csgCloneV(polys[0].normal),
        w: polys[0].w,
    };
    const front = [], back = [];
    for (let i = 0; i < polys.length; i++) {
        csgSplitPoly(node.plane, polys[i], node.polygons, node.polygons, front, back);
    }
    if (front.length) {
        if (!node.front) node.front = csgNode();
