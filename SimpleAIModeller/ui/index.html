            historyStack.shift();
            historyIndex--;
        }
    }
    if (restoreHistory(-1)) setStatus(t('status.undo'), 'ok');
}

function redo() {
    if (restoreHistory(1)) setStatus(t('status.redo'), 'ok');
}

function specNode(name) {
    if (!appState.spec) return null;
    return (appState.spec.nodes || []).find(n => n.n === name) || null;
}

function findMeshByName(name) {
    if (!assetRoot) return null;
    let found = null;
    assetRoot.traverse((c) => {
        if (!found && c.isMesh && c.name === name) found = c;
    });
    return found;
}

function selectNode(name, quiet) {
    selectedName = name || '';
    selectedMesh = name ? findMeshByName(name) : null;

    // Evidenzia nell'outliner.
    $$('#nodesList li').forEach((li) => {
        li.classList.toggle('selected', li.dataset.node === selectedName);
    });

    if (gizmo) {
        if (selectedMesh) {
            gizmo.attach(selectedMesh);
            gizmo.visible = true;
        } else {
            gizmo.detach();
            gizmo.visible = false;
        }
    }
    const box = $('selInfo');
    if (box) {
        const n = specNode(selectedName);
        box.textContent = n
            ? t('sel.info', {
                name: n.n, prim: n.p,
                mat: n.mat || '—',
                locked: n.locked ? t('sel.locked') : '',
            })
            : t('sel.none');
    }
    if (!quiet) _needsRender = true;
}

/** Click nel viewport: raycast sulle parti. */
function wirePicking() {
    const canvas = $('viewport');
    if (!canvas) return;
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let downX = 0, downY = 0;
    canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
    canvas.addEventListener('pointerup', (e) => {
        // Un trascinamento e' orbita, non selezione: senza questa soglia
        // ogni rotazione della camera cambierebbe la selezione.
        if (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4) return;
        if (gizmo && gizmo.dragging) return;
        const r = canvas.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        ray.setFromCamera(ndc, camera);
        const hits = ray.intersectObjects(assetRoot ? assetRoot.children : [], true);
        const hit = hits.find(h => h.object && h.object.isMesh
                              && !/_outline$/.test(h.object.name));
        selectNode(hit ? hit.object.name : '');
    });
}

function initGizmo() {
    if (!TransformControls || !camera || !renderer) return;
    gizmo = new TransformControls(camera, renderer.domElement);
    gizmo.setSpace('local');
    gizmo.visible = false;
    gizmo.addEventListener('change', () => { _needsRender = true; });
    gizmo.addEventListener('dragging-changed', (e) => {
        if (controls) controls.enabled = !e.value;
        if (e.value) {
            pushHistory();
            _gizmoStart = selectedMesh ? {
                pos: selectedMesh.position.clone(),
                rot: selectedMesh.rotation.clone(),
                scale: selectedMesh.scale.clone(),
            } : null;
        } else {
            commitGizmo();
        }
    });
    // In r15x+ TransformControls non e' un Object3D: si aggiunge il suo helper.
    const helper = (typeof gizmo.getHelper === 'function') ? gizmo.getHelper() : gizmo;
    scene.add(helper);
    gizmo._helper = helper;
}

let _gizmoStart = null;

/**
 * Scrive la trasformazione del gizmo nella spec.
 *
 * Le misure sono ESPRESSIONI (`(lama_a+lama_b)/2`): sostituirle con un numero
 * scollegherebbe il nodo dalla catena del piano. Quindi si scrive il valore
 * numerico E si marca il nodo `locked`, cosi' l'audit non lo tratta piu' come
 * un errore del modello — e' una scelta di chi lo ha mosso.
 */
function commitGizmo() {
    if (!selectedMesh || !selectedName || !appState.spec) return;
    const node = specNode(selectedName);
    if (!node) return;
    const built = appState.built;
    const partBefore = built && built.parts.find(p => p.name === selectedName);

    if (gizmoMode === 'translate') {
        const d = selectedMesh.position;
        if (d.lengthSq() < 1e-12) return;
        const at = (partBefore ? meshBounds(partBefore).center : [0, 0, 0]);
        // `at` della spec e' il centro del volume: si somma lo spostamento.
        const cur = Array.isArray(node.at) ? node.at.slice() : [0, 0, 0];
        node.at = [
            _numOrExpr(cur[0], d.x), _numOrExpr(cur[1], d.y), _numOrExpr(cur[2], d.z),
        ];
    } else if (gizmoMode === 'rotate') {
        const e = selectedMesh.rotation;
        const deg = (v) => Math.round(v * 180 / Math.PI * 100) / 100;
        const cur = Array.isArray(node.rot) ? node.rot.slice() : [0, 0, 0];
        node.rot = [
            _numOrExpr(cur[0], deg(e.x)), _numOrExpr(cur[1], deg(e.y)),
            _numOrExpr(cur[2], deg(e.z)),
        ];
    } else if (gizmoMode === 'scale') {
        const s = selectedMesh.scale;
        const cur = Array.isArray(node.s) ? node.s.slice() : [1, 1, 1];
        node.s = [_mulOrExpr(cur[0], s.x), _mulOrExpr(cur[1], s.y), _mulOrExpr(cur[2], s.z)];
    }
    node.locked = true;
    selectedMesh.position.set(0, 0, 0);
    selectedMesh.rotation.set(0, 0, 0);
    selectedMesh.scale.set(1, 1, 1);

    rebuildAfterEdit();
}

/** Somma un delta a un campo che puo' essere numero o espressione. */
function _numOrExpr(cur, delta) {
    if (Math.abs(delta) < 1e-9) return cur;
    if (typeof cur === 'number') return Math.round((cur + delta) * 100000) / 100000;
    const d = Math.round(delta * 100000) / 100000;
    return '(' + String(cur) + ')' + (d >= 0 ? '+' : '') + d;
}

function _mulOrExpr(cur, factor) {
    if (Math.abs(factor - 1) < 1e-9) return cur;
    if (typeof cur === 'number') return Math.round(cur * factor * 100000) / 100000;
    return '(' + String(cur) + ')*' + (Math.round(factor * 100000) / 100000);
}

function rebuildAfterEdit() {
    const built = showSpec(appState.spec);
    appState.built = built;
    const defects = validateAll(appState.spec, built, { hasPlan: !!appState.plan });
    showSpecInUi(appState.spec, built, defects);
    selectNode(selectedName, true);
}

function setGizmoMode(mode) {
    gizmoMode = mode;
    if (gizmo) gizmo.setMode(mode);
    $$('[data-gizmo]').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-gizmo') === mode);
    });
    _needsRender = true;
}

function deleteSelected() {
    if (!selectedName || !appState.spec) return;
    pushHistory();
    const name = selectedName;
    appState.spec.nodes = (appState.spec.nodes || []).filter(n => n.n !== name);
    // Le booleane che puntavano al nodo cancellato restano orfane.
    for (const n of appState.spec.nodes) {
        if (n.of === name) { delete n.op; delete n.of; }
    }
    selectNode('');
    rebuildAfterEdit();
    setStatus(t('status.deleted', { name: name }), 'ok');
}

function duplicateSelected() {
    const node = specNode(selectedName);
    if (!node || !appState.spec) return;
    pushHistory();
    const copy = JSON.parse(JSON.stringify(node));
    let i = 2;
    const names = new Set(appState.spec.nodes.map(n => n.n));
    while (names.has(copy.n + '_' + i)) i++;
    copy.n = copy.n + '_' + i;
    copy.locked = true;
    appState.spec.nodes.push(copy);
    rebuildAfterEdit();
    selectNode(copy.n);
    setStatus(t('status.duplicated', { name: copy.n }), 'ok');
}

function toggleWireframe() {
    if (!assetRoot) return;
    assetRoot.traverse((c) => {
        if (c.isMesh && c.material && !/_outline$/.test(c.name)) {
            c.material.wireframe = !c.material.wireframe;
        }
    });
    _needsRender = true;
}

function frameSelection() {
    if (selectedMesh && appState.built) {
        const part = appState.built.parts.find(p => p.name === selectedName);
        if (part) {
            fitCameraToAsset(meshBounds(part));
            return;
        }
    }
    if (appState.built) fitCameraToAsset(appState.built.bounds);
}

function wireShortcuts() {
    window.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        // In un campo di testo le lettere sono testo, non comandi.
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
            if (e.key === 'Escape') e.target.blur();
            return;
        }
        const k = e.key.toLowerCase();
        if ((e.ctrlKey || e.metaKey) && k === 'z') {
            e.preventDefault();
            if (e.shiftKey) redo(); else undo();
            return;
        }
        if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
        if ((e.ctrlKey || e.metaKey) && k === 'd') { e.preventDefault(); duplicateSelected(); return; }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (k === 'g') { setGizmoMode('translate'); e.preventDefault(); }
        else if (k === 'r') { setGizmoMode('rotate'); e.preventDefault(); }
        else if (k === 's') { setGizmoMode('scale'); e.preventDefault(); }
        else if (k === 'w') { toggleWireframe(); e.preventDefault(); }
        else if (k === 'f') { frameSelection(); e.preventDefault(); }
        else if (k === 'delete' || k === 'backspace') { deleteSelected(); e.preventDefault(); }
        else if (k === 'escape') { selectNode(''); }
        else if (k >= '1' && k <= '6') {
            const views = ['front', 'back', 'left', 'right', 'top', 'persp'];
            setView(views[parseInt(k, 10) - 1]);
            e.preventDefault();
        }
    });
}

function initEditor() {

// =======================================================================
//  10 - i18n (stesso schema del padre: t() + data-i18n)
// =======================================================================

var i18nDict = {};
var i18nCache = {};
var i18nLang = 'it';
var i18nApplied = false;
var i18nLocales = [{ code: 'it', name: 'Italiano' }, { code: 'en', name: 'English' }];

function i18nInterpolate(str, vars) {
    if (!vars || typeof str !== 'string') return str;
    return str.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
}

function t(key, vars) {
    let s = (i18nDict && key in i18nDict) ? i18nDict[key] : undefined;
    if (s === undefined && i18nCache && i18nCache.it && key in i18nCache.it) s = i18nCache.it[key];
    if (s === undefined) s = key;
    return i18nInterpolate(s, vars);
}

function i18nValue(key) {
    if (i18nDict && key in i18nDict) return i18nDict[key];
    if (i18nCache && i18nCache.it && key in i18nCache.it) return i18nCache.it[key];
    return undefined;
}

function applyI18n(root) {
    root = root || document;
    $$('[data-i18n]', root).forEach((el) => {
        const v = i18nValue(el.getAttribute('data-i18n'));
        if (v !== undefined) el.textContent = v;
    });
    $$('[data-i18n-title]', root).forEach((el) => {
        const v = i18nValue(el.getAttribute('data-i18n-title'));
        if (v !== undefined) el.setAttribute('title', v);
    });
    $$('[data-i18n-placeholder]', root).forEach((el) => {
        const v = i18nValue(el.getAttribute('data-i18n-placeholder'));
        if (v !== undefined) el.setAttribute('placeholder', v);
    });
    const title = i18nValue('app.title');
    if (title !== undefined) document.title = title;
    document.documentElement.setAttribute('lang', i18nLang);
}

async function setLang(code, opts) {
    opts = opts || {};
    try {
        if (!i18nCache.it) {
            try {
                const r = await fetch('locales/it.json');
                if (r.ok) i18nCache.it = await r.json();
            } catch (e) { /* offline */ }
        }
        let dict;
        if (code === 'it' && i18nCache.it) dict = i18nCache.it;
        else {
            const r = await fetch('locales/' + code + '.json');
            if (!r.ok) throw new Error('locale ' + code);
            dict = await r.json();
            i18nCache[code] = dict;
        }
        i18nDict = dict;
        i18nLang = code;
        applyI18n(document);
        i18nApplied = true;
        if (!opts.silent) savePref('lang', code);
        const sel = $('languageSelect');
        if (sel && sel.value !== code) sel.value = code;
    } catch (e) {
        console.warn('[i18n]', code, e);
    }
}

async function bootI18n() {
    try {
        const r = await fetch('locales/index.json');
        if (r.ok) {
            const idx = await r.json();
            if (idx && Array.isArray(idx.locales)) i18nLocales = idx.locales;
        }
    } catch (e) { /* offline */ }
    const sel = $('languageSelect');
    if (sel) {
        sel.innerHTML = '';
        for (const l of i18nLocales) {
            const o = document.createElement('option');
            o.value = l.code; o.textContent = l.name;
            sel.appendChild(o);
        }
        sel.onchange = () => setLang(sel.value);
    }
    let start = 'it';
    const saved = loadPref('lang', null);
    if (saved && i18nLocales.some(l => l.code === saved)) start = saved;
    else {
        const nav = String((navigator && navigator.language) || 'it').slice(0, 2).toLowerCase();
        if (i18nLocales.some(l => l.code === nav)) start = nav;
    }
    await setLang(start, { silent: true });
}

// =======================================================================

async function api(method, path, body) {
    const opts = { method: method, headers: {} };
    if (body !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
    }
    const res = await fetch(path, opts);
    let data = null;
    const text = await res.text();
    try { data = text ? JSON.parse(text) : null; } catch (e) {
        data = { error: text.slice(0, 300) };
    }
    if (!res.ok) {
        const err = new Error((data && data.error) || (res.status + ' ' + res.statusText));
        err.status = res.status;
        err.data = data;
        throw err;
    }
    return data;
}

function apiGet(path) { return api('GET', path); }
function apiPost(path, body) { return api('POST', path, body); }
function apiDelete(path, body) { return api('DELETE', path, body); }

// chiamata AI: due bastano a chiudere gli errori aritmetici (che sono locali e
// puntuali), e oltre si entra nel territorio in cui il modello ricomincia a
// riscrivere parti sane.
const MAX_FIX_ROUNDS = 2;

function setStatus(msg, kind) {

function readForm() {

        detail: parseInt(($('detailSelect') && $('detailSelect').value) || '2', 10),
        size: [
            parseFloat(($('sizeX') && $('sizeX').value) || '0') || 0,
            parseFloat(($('sizeY') && $('sizeY').value) || '0') || 0,
            parseFloat(($('sizeZ') && $('sizeZ').value) || '0') || 0,
        ],

        autofix: !($('autofixCheck') && !$('autofixCheck').checked),

        notes: ($('notesInput') && $('notesInput').value) || '',
    };
}

function renderPlan(plan) {
    const box = $('planOut');
    if (!box) return;
    if (!plan || !plan.chain) {
        box.textContent = t('plan.none');
        return;
    }
    const ax = plan.axis.toUpperCase();
    const lines = [];
    lines.push(t('plan.header', {
        axis: ax,
        len: plan.axisLength.toFixed(3),
        total: plan.total.map(v => v.toFixed(3)).join(' x '),
    }));
    for (const s of plan.chain) {
        lines.push('  ' + s.n.padEnd(16).slice(0, 16)
            + ' ' + s.from.toFixed(3) + ' → ' + s.to.toFixed(3)
            + '  (' + (s.to - s.from).toFixed(3) + ')'
            + '  w' + s.w.toFixed(3) + ' d' + s.d.toFixed(3));
    }
    for (const s of (plan.extras || [])) {
        lines.push('  · ' + s.n.padEnd(14).slice(0, 14)
            + ' su ' + (s.of || '-')
            + ' ' + s.from.toFixed(3) + '→' + s.to.toFixed(3));
    }
    if (plan.repairs && plan.repairs.length) {
        lines.push(t('plan.repaired', { n: plan.repairs.length }));
    }
    box.textContent = lines.join('\n');
}

function showSpecInUi(spec, built, defects) {
    appState.spec = spec;
    appState.built = built;
    appState.defects = defects || [];
    // JSON
    const jsonEl = $('jsonOut');
    if (jsonEl) jsonEl.value = JSON.stringify(spec, null, 2);
    // Stats
    const statsEl = $('statsOut');
    if (statsEl && built) {
        const m = metricsOf(spec, built);
        appState.metrics = m;
        statsEl.textContent =
            t('stats.line', {
                nodes: m.nodes, parts: m.parts, tris: m.tris,
                size: m.bounds.size.map(x => x.toFixed(3)).join(' x '),
                closed: m.closed ? t('stats.closed') : t('stats.open'),
            });
    }
    // Nodes list
    const list = $('nodesList');
    if (list) {
        list.innerHTML = '';
        for (const n of (spec.nodes || [])) {
            const li = document.createElement('li');
            li.dataset.node = n.n;
            li.textContent = n.n + '  ·  ' + n.p
                + (n.mat ? '  ·  ' + n.mat : '')
                + (n.op ? '  ·  ' + n.op + '→' + n.of : '')
                + (n.mir ? '  ·  mir:' + n.mir : '')
                + (n.locked ? '  ·  🔒' : '');
            li.addEventListener('click', () => selectNode(n.n));
            if (n.n === selectedName) li.classList.add('selected');
            list.appendChild(li);
        }
    }
    // Defects
    renderDefects(appState.defects);
    // Params
    const paramsEl = $('paramsList');
    if (paramsEl) {
        paramsEl.innerHTML = '';
        for (const [k, v] of Object.entries(spec.params || {})) {
            const row = document.createElement('div');
            row.className = 'param-row';
            const lab = document.createElement('label');
            lab.textContent = k;
            const inp = document.createElement('input');
            inp.type = 'number'; inp.step = 'any'; inp.value = v;
            inp.dataset.param = k;
            inp.addEventListener('change', () => {
                if (!appState.spec) return;
                appState.spec.params[k] = parseFloat(inp.value) || 0;
                rebuildCurrent();
            });
            row.appendChild(lab); row.appendChild(inp);

}

function renderDefects(defects) {
    const box = $('defectsList');
    if (!box) return;
    box.innerHTML = '';
    if (!defects || !defects.length) {
        box.innerHTML = '<li class="ok">' + t('defects.none') + '</li>';
        return;
    }
    for (const d of defects) {
        const li = document.createElement('li');
        li.className = 'sev-' + (d.sev || 'medium');
        li.innerHTML = '<strong>[' + (d.sev || '?') + '] ' + (d.code || '')
            + (d.where ? ' @ ' + d.where : '') + '</strong>'
            + '<div>' + (d.what || '') + '</div>'
            + (d.fix ? '<div class="fix">' + d.fix + '</div>' : '');
        box.appendChild(li);
    }
}

function rebuildCurrent() {
    if (!appState.spec) return;
    const built = showSpec(appState.spec);
    const defects = validateAll(appState.spec, built, { hasPlan: !!appState.plan });
    showSpecInUi(appState.spec, built, defects);
    return { built, defects };
}

/** Audit aritmetico contro il piano. Nessuna AI: e' una somma, e sta in un solo
 *  posto (Python, `src/plan.py`) proprio per non avere due implementazioni. */
async function auditAgainstPlan(spec, built) {
    if (!appState.plan || !appState.plan.chain) return [];
    try {
        const data = await apiPost('/api/asset/audit', {
            plan: appState.plan,
            measured: measuredFor(built, spec),
        });
        return data.defects || [];
    } catch (e) {
        console.warn('[audit]', e);
        return [];
    }
}

function mergeDefects(lists) {
    const seen = new Set();
    const out = [];
    for (const list of lists) {
        for (const d of (list || [])) {
            const k = (d.code || '') + '|' + (d.where || '');
            if (seen.has(k)) continue;
            seen.add(k);
            out.push(d);
        }
    }
    const rank = { high: 0, medium: 1, low: 2 };
    out.sort((a, b) => (rank[a.sev] || 9) - (rank[b.sev] || 9));
    return out;
}

function countHigh(defects) {
    return (defects || []).filter(d => d.sev === 'high').length;
}

/** Un giro di correzione: patch AI guidata dai difetti, poi ricostruzione e
 *  riaudit. Ritorna i nuovi difetti, o null se la patch e' fallita. */
async function fixRound(defects, humanText) {
    const data = await apiPost('/api/asset/patch', {
        spec: appState.spec,
        plan: appState.plan,
        defects: defects,
        request: humanText || '',
        model: readForm().model,
    });
    let spec = data.spec;
    let built = showSpec(spec);
    const ar = autoRepair(spec, built);
    if (ar.repairs.length) {
        spec = ar.spec;
        built = showSpec(spec);
    }
    appState.spec = spec;
    appState.built = built;
    const local = validateAll(spec, built, { hasPlan: !!appState.plan });
    const audit = await auditAgainstPlan(spec, built);
    const merged = mergeDefects([audit, local]);
    showSpecInUi(spec, built, merged);
    return { defects: merged, applied: data.applied || 0 };
}

async function doGenerate() {
    const form = readForm();
    if (!form.prompt) {
        setStatus(t('err.noPrompt'), 'error');
        return;
    }
    setBusy(true, form.planFirst ? t('status.planning') : t('status.generating'));
    appState.rounds = 0;
    try {
        const data = await apiPost('/api/asset/generate', {
            prompt: form.prompt,
            cat: form.cat,
            style: form.style,
            detail: form.detail,
            size: (form.size[0] > 0 || form.size[1] > 0 || form.size[2] > 0)
                ? form.size : null,
            ground: form.ground,
            planFirst: form.planFirst,
            notes: form.notes,
            model: form.model,
        });
        appState.plan = data.plan || null;
        renderPlan(appState.plan);

        let spec = data.spec;
        let built = showSpec(spec);
        const ar = autoRepair(spec, built);
        if (ar.repairs.length) {
            spec = ar.spec;
            built = showSpec(spec);
        }
        appState.spec = spec;
        appState.built = built;

        let local = validateAll(spec, built, { hasPlan: !!appState.plan });
        let audit = await auditAgainstPlan(spec, built);
        let defects = mergeDefects([audit, local]);
        showSpecInUi(spec, built, defects);

        // RATCHET aritmetico: finche' ci sono difetti gravi e i giri restano,
        // si corregge. La condizione di uscita non e' "il modello dice ok" ma
        // "i numeri tornano", che e' l'unica che non si puo' allucinare.
        while (form.autofix && countHigh(defects) > 0 && appState.rounds < MAX_FIX_ROUNDS) {
            appState.rounds++;
            setBusy(true, t('status.fixing', {
                round: appState.rounds, max: MAX_FIX_ROUNDS,
                n: countHigh(defects),
            }));
            const before = countHigh(defects);
            let res;
            try {
                res = await fixRound(defects, '');
            } catch (e) {
                console.warn('[fix]', e);
                break;
            }
            defects = res.defects;
            // Se un giro non migliora niente, insistere spreca chiamate.
            if (countHigh(defects) >= before) break;
        }

        // Critica visiva opzionale, DOPO che i numeri tornano: giudicare
        // l'estetica di un modello con le misure sbagliate e' tempo perso.
        if (form.vision && appState.visionOk !== false && countHigh(defects) === 0) {
            await doCritique(false);
        } else {
            setStatus(t('status.ready', {
                nodes: (appState.spec.nodes || []).length,
                defects: defects.length,
            }), countHigh(defects) ? 'warn' : 'ok');
        }
    } catch (e) {
        console.error(e);
        if (e.status === 401) {
            setStatus(t('err.auth'), 'error');
            openSettings();
        } else {
            setStatus(t('err.generate', { msg: e.message || e }), 'error');
        }
    } finally {
        setBusy(false);
    }
}

async function doCritique(fromGenerate) {
    if (!appState.spec || !appState.built) {
        setStatus(t('err.noAsset'), 'error');
        return;
    }
    setBusy(true, t('status.critiquing'));
    try {
        const metrics = metricsOf(appState.spec, appState.built);
        let image = null;
        if (appState.visionOk !== false && ($('visionCheck') && $('visionCheck').checked)) {
            try {
                image = contactSheetDataURL({ tileW: 280, tileH: 210 });
            } catch (e) {
                console.warn('[sheet]', e);
            }
        }
        // Se vision non e' ok, chiedi feedback umano.
        if (!image || appState.visionOk === false) {
            setBusy(false);
            const human = window.prompt(t('critique.humanPrompt'), '');
            if (human == null || !String(human).trim()) {
                setStatus(t('status.ready', {
                    nodes: (appState.spec.nodes || []).length,
                    defects: appState.defects.length,
                }), 'ok');
                return;
            }
            await doPatch(String(human).trim());
            return;
        }
        const data = await apiPost('/api/asset/critique', {
            spec: appState.spec,
            metrics: metrics,
            image: image,
            request: ($('promptInput') && $('promptInput').value) || '',
        });
        const defects = (data.defects || []).concat(
            // tiene anche i validatori locali
            appState.defects.filter(d => d.sev === 'high')
        );
        // dedup by code+where
        const seen = new Set();
        const merged = [];
        for (const d of defects) {
            const k = d.code + '|' + d.where;
            if (seen.has(k)) continue;
            seen.add(k);
            merged.push(d);
        }
        appState.defects = merged;
        renderDefects(merged);
        setStatus(t('status.critiqueDone', {
            verdict: data.verdict || '?',
            score: data.score != null ? data.score : '—',
            n: merged.length,
        }), data.verdict === 'pass' ? 'ok' : 'warn');

        if (data.verdict === 'fail' && merged.length && fromGenerate) {
            // Una passata di patch automatica.
            await doPatch('', merged);
        }
    } catch (e) {
        console.error(e);
        setStatus(t('err.critique', { msg: e.message || e }), 'error');
    } finally {
        setBusy(false);
    }
}

async function doPatch(humanText, defects) {
    if (!appState.spec) return;
    setBusy(true, t('status.patching'));
    try {
        const res = await fixRound(defects || appState.defects, humanText || '');
        setStatus(t('status.patched', {
            applied: res.applied,
            defects: res.defects.length,
        }), countHigh(res.defects) ? 'warn' : 'ok');
    } catch (e) {
        console.error(e);
        setStatus(t('err.patch', { msg: e.message || e }), 'error');
    } finally {
        setBusy(false);
    }
}

async function probeVision() {
    const el = $('visionStatus');
    try {
        if (el) el.textContent = t('vision.probing');
        const data = await apiPost('/api/vision/probe', {});
        appState.visionOk = !!data.ok;
        appState.visionReason = data.reason || '';
        if (el) {
            el.textContent = data.ok
                ? t('vision.ok', { s: data.seconds || '?' })
                : t('vision.fail', { reason: data.reason || '?' });
            el.dataset.ok = data.ok ? '1' : '0';
        }
        const chk = $('visionCheck');
        if (chk && !data.ok) {
            chk.checked = false;
            chk.disabled = data.reason === 'typeUnsupported'
                || data.reason === 'customUnsupported';
        }
        return data;
    } catch (e) {
        appState.visionOk = false;
        if (el) el.textContent = t('vision.fail', { reason: e.message || e });
        return null;
    }
}

              at: [0, 'h/2+t', 0], op: 'sub', of: 'corpo' },
            { n: 'fascia', p: 'box', s: ['w+t*0.4', 't*1.2', 'd+t*0.4'],
              at: [0, 'h*0.25', 0], mat: 'ferro',
              arr: { n: 2, step: [0, 'h*0.5', 0] } },
            { n: 'coperchio', p: 'box', s: ['w', 'lid', 'd'],
              at: [0, 'h+lid/2', 0], mat: 'legno', bone: 'cardine', interactive: true },
            { n: 'cardine', p: 'cyl', r: 't*0.6', len: 'w*0.8', axis: 'x',
              at: [0, 'h+lid*0.5', '-d/2+t*0.6'], mat: 'ferro' },
        ],
        rig: [{ b: 'cardine', piv: [0, 'h', '-d/2'], axis: 'x', lim: [-100, 0] }],
        clips: {
            apri: { dur: 0.6, loop: false,
                    keys: [[0, { cardine: [0, 0, 0] }],
                           [0.6, { cardine: [-95, 0, 0] }]] },
        },
        logic: [{ on: 'coperchio', var: 'aperta', trig: 'interact', clip: 'apri' }],
        col: [{ t: 'box', at: [0, 'h/2', 0], s: ['w', 'h+lid', 'd'] }],
        flags: ['hollow'],
    };
    // Le espressioni restano stringhe: le risolve buildSpec.
    // Ma bevel numerico e' gia' risolto.
    const built = showSpec(demo);
    appState.plan = null;
    renderPlan(null);
    const defects = validateAll(demo, built, { hasPlan: false });
    showSpecInUi(demo, built, defects);
    setStatus(t('status.demo'), 'ok');
}

/** Popola il selettore modello dal provider attivo. Onesta': con Gemini a
 *  cookie il client installato NON espone il modello (vedi `_gemini_client` nel
 *  padre), quindi la scelta vale per i provider a chiave API. Dirlo e' meglio
 *  che offrire una tendina che non fa niente. */
async function populateModels() {
    const sel = $('modelSelect');
    if (!sel) return;
    try {
        const prov = await apiGet('/api/providers');
        const active = (prov.providers || []).find(p => p.id === prov.active);
        sel.innerHTML = '';
        const opt0 = document.createElement('option');
        opt0.value = '';
        opt0.textContent = t('model.default');
        sel.appendChild(opt0);
        let list = [];
        if (active && active.type === 'gemini_cookies') list = prov.geminiModels || [];
        else if (active && active.type === 'anthropic') list = prov.anthropicModels || [];
        else if (active && active.model) list = [active.model];
        for (const m of list) {
            const o = document.createElement('option');
            o.value = m; o.textContent = m;
            sel.appendChild(o);
        }
        const note = $('modelNote');
        if (note) {
            note.textContent = (active && active.type === 'gemini_cookies')
                ? t('model.geminiNote') : '';
        }
    } catch (e) { /* offline */ }
}

function wireUi() {
    const gen = $('generateBtn');
    if (gen) gen.addEventListener('click', doGenerate);
    const demo = $('demoBtn');
    if (demo) demo.addEventListener('click', loadDemo);
    const crit = $('critiqueBtn');
    if (crit) crit.addEventListener('click', () => doCritique(false));
    const patch = $('patchBtn');
    if (patch) patch.addEventListener('click', () => {
        const human = window.prompt(t('critique.humanPrompt'), '');
        if (human != null) doPatch(String(human));
    });
    const setBtn = $('settingsBtn');
    if (setBtn) setBtn.addEventListener('click', openSettings);
    const setClose = $('settingsClose');
    if (setClose) setClose.addEventListener('click', closeSettings);
    const saveCk = $('saveCookiesBtn');
    if (saveCk) saveCk.addEventListener('click', saveCookies);
    const probeBtn = $('probeVisionBtn');
    if (probeBtn) probeBtn.addEventListener('click', probeVision);

    // Views
    $$('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.getAttribute('data-view')));
    });

    // Export
    const expBundle = $('exportBundleBtn');
    if (expBundle) expBundle.addEventListener('click', async () => {
        try {
            setBusy(true, t('status.zipping'));
            const n = await exportBundle(appState.spec, appState.built, appState.plan);
            setStatus(t('status.bundled', { kb: Math.round(n / 1024) }), 'ok');
        } catch (e) {
            setStatus(t('err.export', { msg: e.message }), 'error');
        } finally { setBusy(false); }
    });
    const expGlb = $('exportGlbBtn');
    if (expGlb) expGlb.addEventListener('click', async () => {
        try {
            await exportGLB(appState.spec, appState.built);
            setStatus(t('status.exported', { fmt: 'GLB' }), 'ok');
        } catch (e) { setStatus(t('err.export', { msg: e.message }), 'error'); }
    });
    const expObj = $('exportObjBtn');
    if (expObj) expObj.addEventListener('click', () => {
        try {
            exportOBJ(appState.spec, appState.built);
            setStatus(t('status.exported', { fmt: 'OBJ' }), 'ok');
        } catch (e) { setStatus(t('err.export', { msg: e.message }), 'error'); }
    });
    const expJson = $('exportJsonBtn');
    if (expJson) expJson.addEventListener('click', () => {
        try {
            exportJSON(appState.spec);
            setStatus(t('status.exported', { fmt: 'JSON' }), 'ok');
        } catch (e) { setStatus(t('err.export', { msg: e.message }), 'error'); }
    });
    const expCol = $('exportColBtn');
    if (expCol) expCol.addEventListener('click', () => {
        try {
            exportColliders(appState.spec);
            setStatus(t('status.exported', { fmt: 'colliders' }), 'ok');
        } catch (e) { setStatus(t('err.export', { msg: e.message }), 'error'); }
    });

    // Sheet preview
    const sheetBtn = $('sheetBtn');
    if (sheetBtn) sheetBtn.addEventListener('click', () => {
        try {
            const url = contactSheetDataURL();
            const w = window.open('');
            if (w) w.document.write('<img src="' + url + '" style="width:100%">');
        } catch (e) { setStatus(t('err.export', { msg: e.message }), 'error'); }
    });

    // Human ref toggle
    const hum = $('humanCheck');
    if (hum) {
        hum.checked = loadPref('showHuman', true);
        hum.addEventListener('change', () => {
            if (humanRef) humanRef.visible = hum.checked;
            savePref('showHuman', hum.checked);
            _needsRender = true;
        });
    }

    // Apply JSON button
    const applyJson = $('applyJsonBtn');
    if (applyJson) applyJson.addEventListener('click', async () => {
        try {
            const raw = JSON.parse($('jsonOut').value);
            const data = await apiPost('/api/asset/normalize', { spec: raw });
            const built = showSpec(data.spec);
            appState.spec = data.spec;
            appState.built = built;
            const local = validateAll(data.spec, built, { hasPlan: !!appState.plan });
            const audit = await auditAgainstPlan(data.spec, built);
            showSpecInUi(data.spec, built, mergeDefects([audit, local]));
            setStatus(t('status.normalized', { n: (data.warnings || []).length }), 'ok');
        } catch (e) {
            setStatus(t('err.generic', { msg: e.message }), 'error');
        }
    });

    // Import (bottone + input file; il drag&drop e' agganciato altrove)
    const impBtn = $('importBtn');
    const impInput = $('importInput');
    if (impBtn && impInput) {
        impBtn.addEventListener('click', () => impInput.click());
        impInput.addEventListener('change', async () => {
            const f = impInput.files && impInput.files[0];
            if (f) await openAnyFile(f);
            impInput.value = '';
        });
    }
    const clearRef = $('clearRefBtn');
    if (clearRef) clearRef.addEventListener('click', () => {
        clearReference();
        setStatus(t('status.refCleared'), 'ok');
    });

    // Ctrl+Enter to generate
    const prompt = $('promptInput');
    if (prompt) prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            doGenerate();
        }
    });
}

// =======================================================================
//  13 - Boot
// =======================================================================

async function boot() {
    await bootI18n();
    initScene();
    wireUi();
    initEditor();
    wireDragDrop();
    // Carica la demo subito, cosi' c'e' qualcosa da vedere senza AI.
    loadDemo();
    pushHistory();
    populateModels().catch(() => {});
    // Sonda vision in background.
    probeVision().catch(() => {});
    // Settings summary
    apiGet('/api/settings').then(s => {
        appState.settings = s;
        if (s.needsCookies) {
            setStatus(t('status.needsCookies'), 'warn');
        }
    }).catch(() => {});
}

// Avvio quando il DOM e' pronto (siamo gia' a fine body, ma per sicurezza).
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
} else {
    boot();
}

// Chiude la IIFE aperta in 00-bootstrap-head.js
})();

</script>
